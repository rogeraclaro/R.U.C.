 * 3. Models
 * State is plain, JSON-friendly data: JSON.parse(JSON.stringify(state)) must round-trip identically.
 * ===================================================================== */
const Plot = {
  create(id, x, y, terrain, richness = 0) {
    return { id, x, y, terrain, richness, ownerId: null, ruc: null, improvements: [], hiddenDeposit: null, productionModifier: 100 };
  },
  /** The town tile (map centre, [manual] "The Store is in the center") can never be claimed. */
  claimable(p) { return !p.ownerId && p.terrain !== TERRAIN.TOWN; },
  /** Mountain probability grows with the distance to the river column (spec section 5). */
  mountainPct(dist) { return dist === 1 ? 30 : dist <= 3 ? 50 : 75; },
  generateMap(rng) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const plots = [];
      for (let y = 0; y < CONFIG.ROWS; y++) {
        for (let x = 0; x < CONFIG.COLS; x++) {
          const id = y * CONFIG.COLS + x;
          if (x === CONFIG.RIVER_COL && y === CONFIG.TOWN_ROW) { plots.push(Plot.create(id, x, y, TERRAIN.TOWN)); continue; }
          if (x === CONFIG.RIVER_COL) { plots.push(Plot.create(id, x, y, TERRAIN.RIVER)); continue; }
          const mountain = rng.chance(Plot.mountainPct(Math.abs(x - CONFIG.RIVER_COL)));
          plots.push(mountain ? Plot.create(id, x, y, TERRAIN.MOUNTAIN, rng.range(1, 3)) : Plot.create(id, x, y, TERRAIN.PLAIN));
        }
      }
      const plains = plots.filter((p) => p.terrain === TERRAIN.PLAIN).length;
      const mountains = plots.filter((p) => p.terrain === TERRAIN.MOUNTAIN).length;
      if (plains >= 8 && mountains >= 8) return plots;
    }
    throw new Error('map generation failed');
  },
  neighbours(plots, plot) {
    return [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => plots.find((p) => p.x === plot.x + dx && p.y === plot.y + dy)).filter(Boolean);
  }
};

const PlayerState = {
  create(id, name, color, isHuman, aiProfile, shape) {
    const inventory = {};
    Object.keys(RESOURCE_DEFS).forEach((k) => { inventory[k] = CONFIG.START_INV[k] || 0; });
    return {
      id, name, color, shape, isHuman, aiProfile, cash: CONFIG.START_CASH, inventory, plots: [],
      score: CONFIG.START_CASH, lastTurnNetWorth: CONFIG.START_CASH, shortageFlags: { foodMissing: 0, energyMissing: 0 },
      // priority: [PROVISIONAL] which non-energy RUCs get the energy when there is not enough for all of them.
      productionReport: null, eventLog: [], priority: ['food', 'smithore']
    };
  }
};

const StoreState = {
  create() {
    const stock = {};
    Object.keys(RESOURCE_DEFS).forEach((k) => { stock[k] = CONFIG.STORE_START[k] || 0; });
    return { stock, ruc: CONFIG.RUC_START };
  }
};

/**
 * Every credit / item movement goes through here. 'store' owns store stock and the bank wallet, 'nature' is the
 * external source/sink (production, consumption, events). Because both ends are tracked, audit() can prove that
 * nothing is created or lost by mistake (acceptance criterion 6).
 */
const ResourceLedger = {
  holder(state, id) {
    if (id === 'store') return { inv: state.store.stock, walletOwner: state.bank };
    if (id === 'nature') return { inv: state.ext.items, walletOwner: state.ext };
    const p = state.players.find((q) => q.id === id);
    if (!p) throw new Error(`unknown owner ${id}`);
    return { inv: p.inventory, walletOwner: p };
  },
  stock(state, id, res) { return this.holder(state, id).inv[res] || 0; },
  cash(state, id) { return this.holder(state, id).walletOwner.cash; },
  /** @returns {boolean} false (and no change at all) when the source lacks stock. */
  moveItem(state, res, from, to, qty) {
    if (!Number.isInteger(qty) || qty <= 0) throw new Error(`bad qty ${qty}`);
    const a = this.holder(state, from); const b = this.holder(state, to);
    if (from !== 'nature' && (a.inv[res] || 0) < qty) return false;
    a.inv[res] = (a.inv[res] || 0) - qty;
    b.inv[res] = (b.inv[res] || 0) + qty;
    return true;
  },
  moveCash(state, from, to, amount) {
    if (!Number.isInteger(amount) || amount < 0) throw new Error(`bad amount ${amount}`);
    if (amount === 0) return true;
    const a = this.holder(state, from); const b = this.holder(state, to);
    // The store acts as an unlimited bank; only colonists are bound by their wallet.
    if (from !== 'nature' && from !== 'store' && a.walletOwner.cash < amount) return false;
    a.walletOwner.cash -= amount;
    b.walletOwner.cash += amount;
    return true;
  },
  /** Returns a list of violations (empty = every credit and item is accounted for). */
  audit(state) {
    const bad = [];
    const cash = state.players.reduce((s, p) => s + p.cash, 0) + state.bank.cash + state.ext.cash;
    if (cash !== state.initialTotals.cash) bad.push(`cash ${cash} != ${state.initialTotals.cash}`);
    Object.keys(state.initialTotals.items).forEach((res) => {
      const n = state.players.reduce((s, p) => s + (p.inventory[res] || 0), 0) + (state.store.stock[res] || 0) + (state.ext.items[res] || 0);
      if (n !== state.initialTotals.items[res]) bad.push(`${res} ${n} != ${state.initialTotals.items[res]}`);
    });
    state.players.forEach((p) => {
      if (p.cash < 0) bad.push(`${p.id} negative cash`);
      Object.entries(p.inventory).forEach(([r, v]) => { if (v < 0) bad.push(`${p.id} negative ${r}`); });
    });
    Object.entries(state.store.stock).forEach(([r, v]) => { if (v < 0) bad.push(`store negative ${r}`); });
    return bad;
  }
};

/** RUCs are not items of the ledger, so they get their own conservation check. `carried` = RUCs a walker is leading right now. */
const RucAudit = {
  count(state, carried = 0) {
    const installed = state.plots.filter((p) => p.ruc).length;
    return { have: state.store.ruc + installed + carried, expected: CONFIG.RUC_START + state.rucs.made - state.rucs.lost };
  },
  ok(state, carried = 0) { const c = this.count(state, carried); return c.have === c.expected && state.store.ruc >= 0; }
};

const GameState = {
  create({ seed, difficulty = 'colony', playerName = 'Roger', colorId = 'yellow' }) {
    const rng = new SeededRNG(seed);
    const plots = Plot.generateMap(rng);
    const palette = CONFIG.PLAYER_COLORS;
    const human = palette.find((c) => c.id === colorId) || palette[0];
    const rest = palette.filter((c) => c.id !== human.id);
    const players = [PlayerState.create('p0', playerName || 'Roger', human.hex, true, null, CONFIG.SHAPES[0])];
    CONFIG.AI_NAMES.forEach((ai, i) => players.push(PlayerState.create(`p${i + 1}`, ai.name, rest[i].hex, false, ai.profile, CONFIG.SHAPES[i + 1])));
    const state = {
      schemaVersion: CONFIG.SCHEMA_VERSION, seed: String(seed), rngState: rng.getState(), difficulty,
      turn: 0, phase: 'TURN_START', phaseData: {}, players, plots, store: StoreState.create(),
      bank: { cash: 0 }, ext: { cash: 0, items: {} }, modifiers: null, event: null,
      landOrder: players.map((p) => p.id), lastAvg: {}, history: [], auctionLog: [],
      // RUC book-keeping: store.ruc + installed + carried = RUC_START + made - lost (checked by RucAudit).
      rucs: { made: 0, lost: 0 }, settlement: null,
      flags: { landAuctions: false }, savedAt: 0, createdAt: 0
    };
    Object.keys(RESOURCE_DEFS).forEach((k) => { state.ext.items[k] = 0; });
    state.initialTotals = { cash: players.reduce((s, p) => s + p.cash, 0), items: {} };
    Object.keys(RESOURCE_DEFS).forEach((k) => {
      state.initialTotals.items[k] = players.reduce((s, p) => s + p.inventory[k], 0) + state.store.stock[k];
    });
    state.modifiers = GameState.freshModifiers();
    return { state, rng };
  },
  /** Per-turn modifiers, all in integer percent so the economy never touches floats. zeroPlots: plots that produce 0 this turn. */
  freshModifiers() { return { foodPct: 100, energyPct: 100, smithorePct: 100, zeroPlots: [] }; },
  clone(state) { return JSON.parse(JSON.stringify(state)); }
};

/* =====================================================================
 * 4. Systems
 * ===================================================================== */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const playerById = (state, id) => state.players.find((p) => p.id === id);
const plotById = (state, id) => state.plots.find((p) => p.id === id);

/** Ordered phase list with insertion by ID, so Phase B can plug phases in without touching the engine. */
class TurnSystem {
  constructor() {
    this.phases = [];
    this.hooks = { afterDevelopment: [] };
    this.phase = null; this.phaseStartedAt = 0; this.phaseData = {}; this.canAdvance = false;
  }
  define(defs) { this.phases = defs.slice(); }
  indexOf(id) { return this.phases.findIndex((p) => p.id === id); }
  get(id) { return this.phases[this.indexOf(id)]; }
  insertAfter(id, def) { const i = this.indexOf(id); if (i < 0) throw new Error(`no phase ${id}`); this.phases.splice(i + 1, 0, def); }
  insertBefore(id, def) { const i = this.indexOf(id); if (i < 0) throw new Error(`no phase ${id}`); this.phases.splice(i, 0, def); }
  onHook(name, fn) { (this.hooks[name] = this.hooks[name] || []).push(fn); }
  runHook(name, game) { (this.hooks[name] || []).forEach((fn) => fn(game)); }
  nextId(id) { const i = this.indexOf(id); return this.phases[(i + 1) % this.phases.length].id; }
  /** `resume` re-enters a phase with the phaseData stored in the save (phases marked `resumable` can be saved mid-way). */
  enter(game, id, resume = false) {
    const def = this.get(id);
    if (!def) throw new Error(`unknown phase ${id}`);
    this.phase = id; this.phaseStartedAt = game.now; this.phaseData = resume && game.state.phaseData ? game.state.phaseData : {}; this.canAdvance = false;
    game.state.phase = id; game.state.phaseData = this.phaseData;
    game.announce(def.label);
    if (def.enter) def.enter(game, this);
  }
  update(game, dt) {
    const def = this.get(this.phase);
    if (!def) return;
    if (def.update) def.update(game, dt, this);
    if (this.canAdvance) this.advance(game);
  }
  advance(game) {
    const def = this.get(this.phase);
    if (def.exit) def.exit(game, this);
    if (this.phase === 'DEVELOPMENT') this.runHook('afterDevelopment', game);
    const next = this.nextId(this.phase);
    game.state.phase = next; game.state.phaseData = {};
    if (def.save) game.save();
    this.enter(game, next);
  }
}

const StoreSystem = {
  /** [PROVISIONAL] formula. [manual]: the price depends on the M.U.L.E.s available and on undeveloped plots (the latter is not modelled). */
  rucPrice(state) { return Math.min(CONFIG.RUC_PRICE_MAX, CONFIG.RUC_BASE + Math.max(0, CONFIG.RUC_START - state.store.ruc) * CONFIG.RUC_PRICE_STEP); },
  /**
   * [PROVISIONAL] formula (the manual only says "supply and demand, and the latest prices paid"): scarce stock pushes the price up,
   * plenty pushes it down: basePrice * clamp(target / max(stock,1), 0.55, 2.2). The result always stays inside the store bounds
   * of the manual: minimum 15/10/14 and ceiling 265.
   */
  centralPrice(def, stock) {
    const ratio = clamp(def.storeTargetStock / Math.max(stock, 1), CONFIG.AUCTION.storeRatioMin, CONFIG.AUCTION.storeRatioMax);
    return clamp(Math.round(def.basePrice * ratio), def.minPrice, def.maxPrice);
  },
  ask(def, stock) { return clamp(Math.round(this.centralPrice(def, stock) * (100 + CONFIG.AUCTION.storeSpreadPct) / 100), def.minPrice, def.maxPrice); },
  bid(def, stock) { return clamp(Math.round(this.centralPrice(def, stock) * (100 - CONFIG.AUCTION.storeSpreadPct) / 100), def.minPrice, def.maxPrice); },
  buyRuc(state, playerId) {
    const price = this.rucPrice(state);
    if (state.store.ruc < 1) return { ok: false, reason: 'no_stock' };
    if (!ResourceLedger.moveCash(state, playerId, 'store', price)) return { ok: false, reason: 'no_cash' };
    state.store.ruc -= 1;
    return { ok: true, price };
  },
  /** [manual] A RUC taken back into the corral returns the FULL price paid for the robot; the outfitting is never refunded. */
  refundRuc(state, playerId, pricePaid) {
    ResourceLedger.moveCash(state, 'store', playerId, pricePaid);
    state.store.ruc += 1;
    return pricePaid;
  },
  /** Outfitting a RUC the colonist is leading (the only way to get a module: there are no loose modules). */
  buyModule(state, playerId, res) {
    const cost = CONFIG.MODULE_COST[res];
    if (!cost) return { ok: false, reason: 'bad_module' };
    if (!ResourceLedger.moveCash(state, playerId, 'store', cost)) return { ok: false, reason: 'no_cash' };
    return { ok: true, price: cost };
  },
  /**
   * Installs an outfitted RUC ({ module, paid }) on an owned plot. Returns { ok, previous }: `previous` is the RUC that was
   * installed there before ([manual] transferring: it now follows the colonist), or null.
   */
  install(state, playerId, plotId, ruc) {
    const plot = plotById(state, plotId);
    if (!plot || plot.ownerId !== playerId || !ruc || !ruc.module) return { ok: false, previous: null };
    const previous = plot.ruc;
    plot.ruc = { module: ruc.module, paid: ruc.paid };
    return { ok: true, previous };
  },
  /** [manual] A M.U.L.E. that runs away is gone: it does not come back to the corral and nothing is refunded. */
  loseRuc(state) { state.rucs.lost += 1; },
  /**
   * Between turns: the smithore the store bought becomes RUCs ([manual] 2 each, one whole turn to build, so they are available in the
   * next development). No free food / energy delivery: the store only has what colonists sold it (or what events changed).
   */
  betweenTurns(state) {
    let made = 0;
    while (state.store.ruc < CONFIG.RUC_MAX && state.store.stock.smithore >= CONFIG.SMITHORE_PER_RUC) {
      ResourceLedger.moveItem(state, 'smithore', 'store', 'nature', CONFIG.SMITHORE_PER_RUC);
      state.store.ruc += 1; made++;
    }
    state.rucs.made += made;
    return { rucsMade: made };
  }
};

const LandGrantSystem = {
  freePlots(state) { return state.plots.filter((p) => Plot.claimable(p)); },
  assign(state, playerId, plotId) {
    const plot = plotById(state, plotId);
    if (!plot || !Plot.claimable(plot)) return false;
    plot.ownerId = playerId;
    playerById(state, playerId).plots.push(plotId);
    return true;
  },
  /** Tie-break order for simultaneous claims: the previous order rotated by one position each turn (turn 1: as created). */
  tieOrder(state) {
    const prev = state.landOrder;
    return state.turn <= 1 ? prev.slice() : prev.slice(1).concat(prev[0]);
  },
  /** How much a colonist wants a free plot: needs first, then the profile's terrain taste, richness and adjacency. */
  scorePlot(state, player, p) {
    const foodCapable = state.plots.filter((q) => q.ownerId === player.id && q.terrain !== TERRAIN.MOUNTAIN).length;
    let s = 0;
    if (player.aiProfile === 'industrial') s += p.terrain === TERRAIN.MOUNTAIN ? 3 + p.richness * 2 : p.terrain === TERRAIN.PLAIN ? 3 : 2;
    else if (player.aiProfile === 'conservative') s += p.terrain === TERRAIN.RIVER ? 5 : p.terrain === TERRAIN.PLAIN ? 4 : 2 + p.richness * 0.5;
    else s += p.terrain === TERRAIN.PLAIN ? 4 : p.terrain === TERRAIN.RIVER ? 3.5 : 2.5 + p.richness * 0.8;
    if (foodCapable < 2 && p.terrain !== TERRAIN.MOUNTAIN) s += 2;
    s += Plot.neighbours(state.plots, p).filter((n) => n.ownerId === player.id).length * 0.8;
    return s;
  }
};

/**
 * Land grant as a real-time race (original M.U.L.E. spirit). A cursor sweeps the free plots row by row; whoever presses while
 * it sits on a free plot gets it. Everything lives in one plain, JSON-friendly object (`land`, kept in phaseData) and advances
 * in FIXED game-clock steps, so the same seed + the same timestamped inputs always give the same result, at any frame rate,
 * and a save taken mid-sweep resumes exactly.
 */
const LandRace = {
  create(state, rng, aiIds) {
    const d = CONFIG.DIFFICULTY[state.difficulty];
    const land = {
      msPerPlot: d.landMsPerPlot, clock: 0, acc: 0, sweep: 0, cursor: -1, dwellLeft: 0, eligible: [],
      claimed: {}, inputs: [], ai: {}, aiIds: aiIds.slice(), tieOrder: LandGrantSystem.tieOrder(state),
      pause: 0, afterPlot: -1, done: false, hold: CONFIG.LAND.holdMs, lastClaim: null
    };
    state.landOrder = land.tieOrder.slice();
    this.startSweep(state, rng, land, 1, state.players.map((p) => p.id));
    return land;
  },
  /** First free plot at or after `from` in sweep order (ids are row-major, so this is left->right, top->bottom). The town is skipped. */
  nextFree(state, from) {
    for (let i = from; i < state.plots.length; i++) if (Plot.claimable(state.plots[i])) return i;
    return -1;
  },
  startSweep(state, rng, land, n, eligible) {
    land.sweep = n; land.eligible = eligible.slice(); land.ai = {};
    land.cursor = this.nextFree(state, 0); land.dwellLeft = land.msPerPlot;
    if (land.cursor < 0 || !land.eligible.length) { this.finish(land); return; }
    land.aiIds.filter((id) => land.eligible.includes(id)).forEach((id) => this.plan(state, rng, land, id));
  },
  finish(land) { land.cursor = -1; land.done = true; land.ai = {}; land.inputs = []; },
  canClaim(land, pid) { return !land.done && !(land.pause > 0) && land.eligible.includes(pid) && land.claimed[pid] === undefined; },
  /** Human input, stamped on the game clock (not wall clock). Duplicate pending presses are collapsed. */
  press(land, pid) {
    if (!this.canClaim(land, pid) || land.inputs.some((i) => i.pid === pid)) return false;
    land.inputs.push({ pid, at: land.clock + land.acc });
    return true;
  },
  /**
   * AI: pick a target among the free plots at or AHEAD of the public cursor (the sweep order is public), scored with the usual
   * valuation +-error, then schedule the press so it lands around the cursor's arrival, shifted by a reaction time drawn
   * from the seeded PRNG. It never looks at anything a human could not see.
   */
  plan(state, rng, land, pid) {
    const d = CONFIG.DIFFICULTY[state.difficulty]; const player = playerById(state, pid);
    const reaction = rng.range(d.reactMin, d.reactMax);
    let best = -1; let bestScore = -1e9; let bestRank = 0; let rank = 0;
    for (let id = land.cursor; id < state.plots.length; id++) {
      const p = state.plots[id]; if (!Plot.claimable(p)) continue;
      const err = (rng.next() * 2 - 1) * d.valuationErr / 100;
      // A small penalty per plot of waiting: the far end of the map may be gone by the time the cursor gets there.
      const sc = LandGrantSystem.scorePlot(state, player, p) * (1 + err) - 0.04 * rank;
      if (sc > bestScore) { bestScore = sc; best = id; bestRank = rank; }
      rank++;
    }
    if (best < 0) { delete land.ai[pid]; return; }
    const arrival = bestRank === 0 ? 0 : land.dwellLeft + (bestRank - 1) * land.msPerPlot;
    // The AI anticipates the arrival by its AVERAGE reaction; its actual (random) reaction decides how early/late it lands.
    const mid = (d.reactMin + d.reactMax) / 2;
    land.ai[pid] = { target: best, pressAt: Math.round(land.clock + Math.max(reaction, arrival + reaction - mid)) };
  },
  update(state, rng, land, dtMs) {
    if (land.done) return;
    land.acc += dtMs;
    while (land.acc >= CONFIG.LAND.stepMs && !land.done) { land.acc -= CONFIG.LAND.stepMs; this.step(state, rng, land); }
  },
  step(state, rng, land) {
    land.clock += CONFIG.LAND.stepMs;
    if (land.pause > 0) {
      // Claim pause: the cursor is hidden and frozen, and any press that lands in this window is simply lost.
      land.inputs = land.inputs.filter((i) => i.at > land.clock);
      land.pause -= CONFIG.LAND.stepMs;
      if (land.pause <= 0) this.resume(state, rng, land);
      return;
    }
    const claimants = [];
    const due = land.inputs.filter((i) => i.at <= land.clock).sort((a, b) => a.at - b.at);
    if (due.length) land.inputs = land.inputs.filter((i) => i.at > land.clock);
    due.forEach((i) => { if (this.canClaim(land, i.pid) && !claimants.includes(i.pid)) claimants.push(i.pid); });
    land.aiIds.forEach((pid) => {
      const a = land.ai[pid];
      if (a && a.pressAt <= land.clock) { delete land.ai[pid]; if (this.canClaim(land, pid) && !claimants.includes(pid)) claimants.push(pid); }
    });
    if (claimants.length && land.cursor >= 0) {
      // Catch-up rule: on a simultaneous claim the poorer colonist wins; equal wealth falls back to the rotated order.
      const worth = (id) => ScoringSystem.netWorth(state, playerById(state, id));
      const winner = claimants.slice().sort((a, b) => (worth(a) - worth(b)) || (land.tieOrder.indexOf(a) - land.tieOrder.indexOf(b)))[0];
      this.claim(state, rng, land, winner);
      return;
    }
    land.dwellLeft -= CONFIG.LAND.stepMs;
    if (land.dwellLeft <= 0) this.advance(state, rng, land);
  },
  claim(state, rng, land, pid) {
    const plotId = land.cursor;
    LandGrantSystem.assign(state, pid, plotId);
    land.claimed[pid] = plotId; land.lastClaim = { pid, plot: plotId, clock: land.clock };
    // AI timers are dropped: they must not run down while the cursor is away, so they are re-planned when it comes back.
    land.ai = {}; land.cursor = -1;
    // Only wait if someone can still claim something afterwards; otherwise the phase ends right after the claim highlight.
    const waiting = land.eligible.some((id) => land.claimed[id] === undefined);
    const canContinue = waiting && this.nextFree(state, plotId + 1) >= 0;
    if (!canContinue) { this.finish(land); return; }
    land.afterPlot = plotId; land.pause = CONFIG.LAND.landClaimPauseMs;
  },
  /** End of the claim pause: the sweep continues at the plot AFTER the claimed one, with a full dwell. */
  resume(state, rng, land) {
    land.pause = 0;
    land.cursor = this.nextFree(state, land.afterPlot + 1); land.dwellLeft = land.msPerPlot;
    if (land.cursor < 0) { this.endSweep(state, rng, land); return; }
    land.aiIds.forEach((id) => { if (this.canClaim(land, id)) this.plan(state, rng, land, id); });
  },
  advance(state, rng, land) {
    land.cursor = this.nextFree(state, land.cursor + 1); land.dwellLeft = land.msPerPlot;
    if (land.cursor < 0) { this.endSweep(state, rng, land); return; }
    land.aiIds.forEach((id) => { const a = land.ai[id]; if (a && a.target < land.cursor) this.plan(state, rng, land, id); });
  },
  /** [manual] One single sweep: a colonist who did not press in time gets no plot this turn (no second sweep). */
  endSweep(state, rng, land) { this.finish(land); }
};

const ProductionSystem = {
  baseYield(plot, res) {
    const row = PRODUCTION_TABLE[plot.terrain];
    const cell = row && (row[plot.richness] || row[0]);
    return cell ? (cell[res] || 0) : 0;
  },
  /** [manual] Smithore (and Crystite) cannot be mined in the river valley: no bonus can make such a plot produce it. */
  canProduce(plot, res) { return plot.terrain !== TERRAIN.TOWN && !(plot.terrain === TERRAIN.RIVER && (res === 'smithore' || res === 'crystite')); },
  sameGood(plot) { const res = plot.ruc.module; return (q) => q.ownerId === plot.ownerId && !!q.ruc && q.ruc.module === res; },
  /** [manual] Economies of scale: +1 if at least one orthogonal neighbour of the same owner makes the same good. Never more than +1. */
  adjacencyBonus(state, plot) { return Plot.neighbours(state.plots, plot).some(this.sameGood(plot)) ? 1 : 0; },
  /** [manual] Learning curve: +1 on each plot for every complete group of 3 own plots making the same good, wherever they are. */
  learningBonus(state, plot) { return Math.floor(state.plots.filter(this.sameGood(plot)).length / 3); },
  /** Average yield (base + both bonuses), before the random variation and the events. */
  meanYield(state, plot) {
    if (!plot.ruc || !this.canProduce(plot, plot.ruc.module)) return 0;
    return this.baseYield(plot, plot.ruc.module) + this.adjacencyBonus(state, plot) + this.learningBonus(state, plot);
  },
  /**
   * [PROVISIONAL] random variation. The manual only says the base is an average and that output "varies from 0 to 8 units"; the real
   * distribution is unknown. Here: a + b with a, b uniform in {-1, 0, +1} from the seeded PRNG (-2..+2, centred on 0). NOT C64-verified.
   */
  variation(rng) { return (rng.int(3) - 1) + (rng.int(3) - 1); },
  clampUnits(u) { return clamp(u, CONFIG.PRODUCTION.min, CONFIG.PRODUCTION.max); },
  /**
   * [PROVISIONAL] order of modifiers: units -> clamp 0..8 -> event percentage (integer, floored once) -> plots zeroed by an event
   * (pest, breakdown). An event can push a plot above 8; nothing is ever negative.
   */
  applyEvents(state, plot, units) {
    const m = state.modifiers; const res = plot.ruc.module;
    if (m.zeroPlots.some((z) => z.plotId === plot.id)) return 0;
    const pct = res === 'food' ? m.foodPct : res === 'energy' ? m.energyPct : res === 'smithore' ? m.smithorePct : 100;
    return Math.max(0, Math.floor(units * pct / 100));
  },
  /** What a colonist can expect (tooltip, AI): the mean with this turn's known events, without the random draw. */
  expectedYield(state, plot) {
    if (!plot.ruc || !this.canProduce(plot, plot.ruc.module)) return 0;
    return this.applyEvents(state, plot, this.clampUnits(this.meanYield(state, plot)));
  },
  /** Real yield of a powered plot this turn: one seeded draw per plot. */
  rollYield(state, plot, rng) {
    if (!plot.ruc || !this.canProduce(plot, plot.ruc.module)) return 0;
    return this.applyEvents(state, plot, this.clampUnits(this.meanYield(state, plot) + this.variation(rng)));
  },
  /**
   * [manual] Food and Smithore RUCs each need one unit of energy left over from the previous turn; energy RUCs power themselves, and
   * energy made this turn never powers anything until the next one. [PROVISIONAL] when energy is short, RUCs are powered in the
   * colonist's fixed priority (food before smithore), then by plot id: the C64 selection is unknown.
   */
  activation(state, p) {
    const mine = state.plots.filter((q) => q.ownerId === p.id && q.ruc).sort((a, b) => a.id - b.id);
    const rank = (m) => { const i = p.priority.indexOf(m); return i < 0 ? 99 : i; };
    const needy = mine.filter((q) => q.ruc.module !== 'energy').sort((a, b) => (rank(a.ruc.module) - rank(b.ruc.module)) || (a.id - b.id));
    const powered = Math.min(needy.length, p.inventory.energy || 0);
    const on = new Set(needy.slice(0, powered).map((q) => q.id));
    mine.forEach((q) => { if (q.ruc.module === 'energy') on.add(q.id); });
    return { mine, on, powered, stopped: needy.length - powered };
  }
};

const ConsumptionSystem = {
  /** [PROVISIONAL] placeholder bands (2/3/4 food per turn): the C64 food table per turn is not documented. */
  foodNeed(turn) { const r = CONFIG.FOOD_NEED.find((x) => turn >= x.from && turn <= x.to); return r ? r.n : CONFIG.FOOD_NEED[2].n; },
  /**
   * [manual] food decides the development time. [PROVISIONAL] numbers: each missing food unit costs 25% of the base time next turn,
   * never below 15 s. There is no money penalty for hunger (the old survival debt does not exist in the original).
   */
  humanTimeMs(state, player) {
    const base = CONFIG.DIFFICULTY[state.difficulty].humanTimeMs;
    const cut = base * (100 - CONFIG.SHORTAGE.timePenaltyPct * player.shortageFlags.foodMissing) / 100;
    return Math.max(CONFIG.SHORTAGE.minTimeMs, Math.floor(cut));
  }
};

/**
 * Settlement of one turn, after development and the planetary event. Applied ONCE, atomically through the ledger, per colonist:
 *   start    the reserve left from the previous turn
 *   used     energy spent by non-energy RUCs (from that reserve) and food eaten
 *   spoiled  [card] 50% of the food left, 25% of the energy left, ore above 50: on the reserve, BEFORE the new harvest
 *   produced the new harvest (it is never spoiled this turn)
 *   final  = start - used - spoiled + produced
 * The report lives in state.settlement, so a reload or a skipped screen never runs it twice.
 */
const SettlementSystem = {
  spoilage(res, left) {
    if (res === 'food') return Math.floor(left * CONFIG.SPOILAGE.foodPct / 100);
    if (res === 'energy') return Math.floor(left * CONFIG.SPOILAGE.energyPct / 100);
    return Math.max(0, left - CONFIG.SPOILAGE.oreCap);
  },
  run(state, rng) {
    if (state.settlement && state.settlement.turn === state.turn) return state.settlement;
    const need = ConsumptionSystem.foodNeed(state.turn);
    const resIds = enabledResources().map((d) => d.id);
    const harvest = [];
    const rows = state.players.map((p) => {
      const blank = () => { const o = {}; resIds.forEach((r) => { o[r] = 0; }); return o; };
      const start = blank(); const used = blank(); const spoiled = blank(); const produced = blank();
      resIds.forEach((r) => { start[r] = p.inventory[r] || 0; });
      const act = ProductionSystem.activation(state, p);
      if (act.powered > 0) ResourceLedger.moveItem(state, 'energy', p.id, 'nature', act.powered);
      used.energy = act.powered;
      const eaten = Math.min(need, p.inventory.food);
      if (eaten > 0) ResourceLedger.moveItem(state, 'food', p.id, 'nature', eaten);
      used.food = eaten;
      p.shortageFlags.foodMissing = need - eaten;
      p.shortageFlags.energyMissing = act.stopped;
      resIds.forEach((r) => {
        const n = this.spoilage(r, p.inventory[r] || 0);
        spoiled[r] = n;
        if (n > 0) ResourceLedger.moveItem(state, r, p.id, 'nature', n);
      });
      const items = act.mine.map((plot) => {
        const on = act.on.has(plot.id);
        const amount = on ? ProductionSystem.rollYield(state, plot, rng) : 0;
        if (amount > 0 && resIds.includes(plot.ruc.module)) { harvest.push({ owner: p.id, res: plot.ruc.module, amount }); produced[plot.ruc.module] += amount; }
        const zero = state.modifiers.zeroPlots.find((z) => z.plotId === plot.id);
        return { plotId: plot.id, module: plot.ruc.module, active: on, amount, zeroed: zero ? zero.reason : null };
      });
      p.productionReport = { turn: state.turn, energyUsed: act.powered, items };
      return { playerId: p.id, need, start, used, spoiled, produced, missingFood: need - eaten, stopped: act.stopped, items };
    });
    harvest.forEach((h) => ResourceLedger.moveItem(state, h.res, 'nature', h.owner, h.amount));
    rows.forEach((row) => { const p = playerById(state, row.playerId); row.final = {}; resIds.forEach((r) => { row.final[r] = p.inventory[r] || 0; }); });
    state.settlement = { turn: state.turn, need, rows };
    return state.settlement;
  }
};

const EventSystem = {
  /** [PROVISIONAL] R.U.C. rule kept from the spec: no negative event on turns 1 and 12 (not C64-verified). */
  safeTurn(state) { return state.turn === 1 || state.turn === CONFIG.TURNS; },
  /**
   * [manual] "The losing player will never receive a bad luck event, and the winning player never gets lucky." Everyone tied for the
   * top is a leader, everyone tied for the bottom is last. While all net worths are equal there is no ranking yet: nobody is excluded.
   */
  standing(state) {
    const w = state.players.map((p) => ScoringSystem.netWorth(state, p));
    const max = Math.max(...w); const min = Math.min(...w);
    if (max === min) return { leaders: [], last: [] };
    return { leaders: state.players.filter((p, i) => w[i] === max).map((p) => p.id), last: state.players.filter((p, i) => w[i] === min).map((p) => p.id) };
  },
  /** Structural preconditions only (an event needs something to act on). */
  applicable(state, id, pid = null) {
    if (id === 'ruc_breakdown') return state.plots.some((q) => q.ownerId === pid && q.ruc);
    if (id === 'pest_attack') return state.plots.some((q) => q.ruc && q.ruc.module === 'food');
    if (id === 'radiation') return state.plots.some((q) => q.ruc);
    return true;
  },
  canHit(state, id, pid) {
    const def = EVENT_DEFS[id];
    if (!this.applicable(state, id, pid) || (def.negative && this.safeTurn(state))) return false;
    const st = this.standing(state);
    return def.negative ? !st.last.includes(pid) : !st.leaders.includes(pid);
  },
  /**
   * [manual] 25% chance at the start of EACH colonist's development turn: one independent draw per colonist. A debug-forced event skips
   * the draw and the leader / last rule, but still needs something to act on.
   */
  rollIndividual(state, rng, pid, forced = null) {
    const hit = rng.chance(CONFIG.EVENTS.individualPct);
    const forcedId = forced && EVENT_DEFS[forced] && EVENT_DEFS[forced].scope === 'individual' && this.applicable(state, forced, pid) ? forced : null;
    if (!hit && !forcedId) return null;
    const pool = INDIVIDUAL_EVENT_IDS.filter((id) => this.canHit(state, id, pid));
    const id = forcedId || (pool.length ? rng.pick(pool) : null);
    return id ? this.build(state, rng, id, pid) : null;
  },
  /** [manual] planetary events come "just before the Production phase". Probability [PROVISIONAL]; at most one per turn. */
  rollPlanet(state, rng, forced = null) {
    const hit = rng.chance(CONFIG.EVENTS.planetPct);
    const forcedId = forced && EVENT_DEFS[forced] && EVENT_DEFS[forced].scope === 'planet' && this.applicable(state, forced) ? forced : null;
    if (!hit && !forcedId) return null;
    const pool = PLANET_EVENT_IDS.filter((id) => this.applicable(state, id) && !(EVENT_DEFS[id].negative && this.safeTurn(state)));
    const id = forcedId || (pool.length ? rng.pick(pool) : null);
    return id ? this.build(state, rng, id, null) : null;
  },
  /** Applies the effect immediately (through the ledger) and returns the card record, whose text carries the numbers applied. */
  build(state, rng, id, targetId) {
    const def = EVENT_DEFS[id]; const m = state.modifiers;
    let target = targetId ? playerById(state, targetId) : null;
    const params = { who: target ? target.name : '', amount: def.amount, foodPct: def.foodPct, energyPct: def.energyPct, smithorePct: def.smithorePct };
    const pickPlot = (pred) => {
      const plot = rng.pick(state.plots.filter(pred));
      target = playerById(state, plot.ownerId); params.who = target.name; params.plot = plot.id + 1;
      return plot;
    };
    const pct = (cur, delta) => Math.round(cur * (100 + delta) / 100);
    if (id === 'pest_attack') m.zeroPlots.push({ plotId: pickPlot((q) => q.ruc && q.ruc.module === 'food').id, reason: 'pest' });
    if (id === 'acid_rain') { m.foodPct = pct(m.foodPct, def.foodPct); m.energyPct = pct(m.energyPct, -def.energyPct); }
    if (id === 'solar_activity') m.energyPct = pct(m.energyPct, def.energyPct);
    if (id === 'planetquake') m.smithorePct = pct(m.smithorePct, -def.smithorePct);
    if (id === 'radiation') { const plot = pickPlot((q) => q.ruc); plot.ruc = null; StoreSystem.loseRuc(state); }
    if (id === 'store_fire') {
      params.lost = enabledResources().map((d) => {
        const n = state.store.stock[d.id] || 0;
        if (n > 0) ResourceLedger.moveItem(state, d.id, 'store', 'nature', n);
        return `${d.label.toLowerCase()} ${n}`;
      }).join(', ');
    }
    if (id === 'pirates') {
      // [manual] Standard: the Pirate plunders everyone's Smithore (Crystite only in the Tournament game, Phase B).
      params.amount = 0;
      state.players.forEach((p) => { const k = p.inventory.smithore || 0; if (k > 0) { ResourceLedger.moveItem(state, 'smithore', p.id, 'nature', k); params.amount += k; } });
    }
    if (id === 'rich_vein') ResourceLedger.moveItem(state, 'smithore', 'nature', targetId, def.amount);
    if (id === 'salvage') ResourceLedger.moveCash(state, 'nature', targetId, def.amount);
    if (id === 'medical_bill') { params.amount = Math.min(def.amount, target.cash); ResourceLedger.moveCash(state, targetId, 'store', params.amount); }
    if (id === 'ruc_breakdown') {
      const plot = rng.pick(state.plots.filter((q) => q.ownerId === targetId && q.ruc));
      params.plot = plot.id + 1; m.zeroPlots.push({ plotId: plot.id, reason: 'breakdown' });
    }
    const rec = {
      id, scope: def.scope, negative: def.negative, name: def.name, art: def.art, origin: def.origin, provisional: !!def.provisional,
      targetId: target ? target.id : null, text: def.text(params), params
    };
    if (target) target.eventLog.push({ turn: state.turn, id, text: rec.text });
    return rec;
  }
};

const ScoringSystem = {
  price(state, res) { return state.lastAvg[res] || RESOURCE_DEFS[res].basePrice; },
  /**
   * [manual] net worth = cash + goods at the latest auction price + $500 per plot + installed RUCs. The RUC is split into robot
   * (CONFIG.RUC_WORTH, [PROVISIONAL]) and module (its outfitting cost, [PROVISIONAL] inferred from the manual's summary example).
   */
  breakdown(state, p) {
    const goods = enabledResources().reduce((s, d) => s + (p.inventory[d.id] || 0) * this.price(state, d.id), 0);
    const plots = state.plots.filter((q) => q.ownerId === p.id);
    const withRuc = plots.filter((q) => q.ruc);
    const land = plots.length * CONFIG.PLOT_VALUE;
    const rucs = withRuc.length * CONFIG.RUC_WORTH;
    const modules = withRuc.reduce((s, q) => s + (CONFIG.MODULE_COST[q.ruc.module] || 0), 0);
    return { cash: p.cash, inventory: goods, plots: land, rucs, modules, total: p.cash + goods + land + rucs + modules };
  },
  netWorth(state, p) { return this.breakdown(state, p).total; },
  /** Closes a turn: refreshes scores and the history chart. */
  endTurn(state) {
    const worths = state.players.map((p) => this.netWorth(state, p));
    state.players.forEach((p, i) => { p.lastTurnNetWorth = worths[i]; p.score = worths[i]; });
    state.history.push({ turn: state.turn, worth: worths.slice() });
  },
  /** [manual] Standard: the colony succeeds with a combined net worth of at least $60,000. There is no per-colonist minimum. */
  survival(state) {
    const combined = state.players.reduce((s, p) => s + this.netWorth(state, p), 0);
    return { survives: combined >= CONFIG.SURVIVAL.combined, combined, needCombined: CONFIG.SURVIVAL.combined };
  },
  /** Tie-breaks: cash, productive plots, then a seeded draw. */
  ranking(state, rng) {
    const rows = state.players.map((p) => ({ p, b: this.breakdown(state, p), prod: state.plots.filter((q) => q.ownerId === p.id && q.ruc).length, tie: rng.next() }));
    rows.sort((a, b) => (b.b.total - a.b.total) || (b.b.cash - a.b.cash) || (b.prod - a.prod) || (a.tie - b.tie));
    return rows;
  }
};

const SaveSystem = {
  serialize(state, rng) { state.rngState = rng.getState(); state.savedAt = Date.now(); return JSON.stringify(state); },
  /** Never accepts an incompatible save silently: an older schema (rules changed) or anything unreadable is refused with a reason. */
  deserialize(text) {
    let state;
    try { state = JSON.parse(text); } catch (e) { return { incompatible: true, reason: 'corrupt' }; }
    if (!state || typeof state !== 'object') return { incompatible: true, reason: 'corrupt' };
    if (state.schemaVersion !== CONFIG.SCHEMA_VERSION) {
      return { incompatible: true, reason: state.schemaVersion < CONFIG.SCHEMA_VERSION ? 'old_rules' : 'unknown', version: state.schemaVersion };
    }
    return { state };
  },
  save(state, rng) {
    try { localStorage.setItem(CONFIG.SAVE_KEY, this.serialize(state, rng)); return true; } catch (e) { return false; }
  },
  has() { try { return !!localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { return false; } },
  load() {
    try { const t = localStorage.getItem(CONFIG.SAVE_KEY); return t ? this.deserialize(t) : null; } catch (e) { return { incompatible: true, reason: 'corrupt' }; }
  },
  clear() { try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) { /* ignore */ } }
};

/**
 * Real-time continuous double auction (spec section 9). Pure, dt-driven engine: no rendering, no wall clock.
 * It only knows generic lots ({id, kind, quantity, sellerId, transferable, getValue(), transfer()}) and a
 * marketDefinition, so a 4th resource - or a future land lot - plugs in without touching this class.
 * [manual] Two stages: a timed DECLARATION (buyer / seller, changeable until the Declare Timer runs out; OUT is a R.U.C. extension),
 * then the TRADE stage with fixed roles, where only prices move. `clock` counts both stages, `t` only the trade stage.
 * The whole engine state is plain data: snapshot() / AuctionEngine.restore() let a save resume in the middle of an auction.
 */
class AuctionEngine {
  /** Fungible resource lot: 1 unit moves from seller to buyer. */
  static fungibleMarket(def) {
    return {
      id: def.id, label: def.label, minPrice: def.minPrice, maxPrice: def.maxPrice, step: def.auctionStep,
      // Colonist-to-colonist limit while the store is out of stock: [manual] there is no rule cap; this is only a UI technical limit.
      playerMaxPrice: Math.max(def.maxPrice, CONFIG.AUCTION.playerPriceMax),
      basePrice: def.basePrice, storeTargetStock: def.storeTargetStock, kind: 'fungible',
      createLot(state, sellerId) {
        return {
          id: `${def.id}:${sellerId}`, kind: 'fungible', quantity: 1, sellerId,
          transferable: ResourceLedger.stock(state, sellerId, def.id) >= 1,
          getValue: () => state.lastAvg[def.id] || def.basePrice,
          transfer: (st, toId) => ResourceLedger.moveItem(st, def.id, sellerId, toId, 1)
        };
      }
    };
  }

  constructor({ market, state, rng, colonists, withStore = true, onTrade = null, declareMs = 0 }) {
    this.market = market; this.state = state; this.rng = rng; this.onTrade = onTrade;
    this.clock = 0; this.t = 0; this.stage = 'declare'; this.declareLeft = declareMs;
    this.ended = false; this.endReason = null;
    this.trades = []; this.volume = 0; this.sum = 0; this.min = null; this.max = null;
    this.crossKey = null; this.crossMs = 0; this.allOutMs = 0; this.noOpMs = 0; this.lastActivity = 0;
    this.withStore = withStore; this.storeStock = null;
    const mid = Math.round((market.minPrice + market.maxPrice) / 4);
    const mk = (id, ownerId, isStore, role) => ({ id, ownerId, isStore, role, priceF: mid, price: mid, priceSince: 0, roleSince: 0, tie: rng.next(), blocked: null });
    this.entries = colonists.map((id) => mk(id, id, false, ROLE.OUT));
    if (withStore) { this.entries.push(mk('store-b', 'store', true, ROLE.BUYER)); this.entries.push(mk('store-s', 'store', true, ROLE.SELLER)); }
    if (withStore) this._updateStore();
  }
  snapshot() {
    return JSON.parse(JSON.stringify({
      clock: this.clock, t: this.t, stage: this.stage, declareLeft: this.declareLeft, ended: this.ended, endReason: this.endReason,
      trades: this.trades, volume: this.volume, sum: this.sum, min: this.min, max: this.max, crossKey: this.crossKey, crossMs: this.crossMs,
      allOutMs: this.allOutMs, noOpMs: this.noOpMs, lastActivity: this.lastActivity, withStore: this.withStore, storeStock: this.storeStock,
      entries: this.entries
    }));
  }
  static restore(snap, { market, state, rng, onTrade = null }) {
    const e = Object.create(AuctionEngine.prototype);
    return Object.assign(e, JSON.parse(JSON.stringify(snap)), { market, state, rng, onTrade });
  }
  entry(id) { return this.entries.find((e) => e.id === id); }
  get colonistEntries() { return this.entries.filter((e) => !e.isStore); }
  /** [manual] With the store out of stock, a colonist's price may go as high as buyers want; otherwise the store bounds apply. */
  playerMax() {
    const stock = this.withStore ? (this.state.store.stock[this.market.id] || 0) : 0;
    return this.withStore && stock > 0 ? this.market.maxPrice : (this.market.playerMaxPrice || this.market.maxPrice);
  }
  priceCap(e) { return !e || e.isStore ? this.market.maxPrice : this.playerMax(); }
  snap(price, e = null) {
    const s = this.market.step;
    return clamp(Math.round(price / s) * s, this.market.minPrice, this.priceCap(e));
  }
  canDeclare() { return !this.ended && this.stage === 'declare'; }
  /** Start marker of a role: [manual] sellers start at the top (store selling price), buyers at the bottom (store buying price). */
  rolePrice(role) {
    const stock = this.state.store.stock[this.market.id] || 0;
    if (role === ROLE.SELLER) return this.withStore ? StoreSystem.ask(this.market, stock) : this.market.maxPrice;
    return this.withStore ? StoreSystem.bid(this.market, stock) : this.market.minPrice;
  }
  /** Only while the declaration lasts; afterwards the role is fixed. Returns true when the entry now has the requested role. */
  setRole(id, role) {
    const e = this.entry(id);
    if (!e) return false;
    if (e.role === role) return true;
    if (!this.canDeclare()) return false;
    e.role = role; e.roleSince = this.clock; e.blocked = null;
    if (role !== ROLE.OUT) this.setPrice(id, this.rolePrice(role));
    return true;
  }
  setPrice(id, price) {
    const e = this.entry(id);
    e.priceF = clamp(price, this.market.minPrice, this.priceCap(e));
    const p = this.snap(e.priceF, e);
    if (p !== e.price) { e.price = p; e.priceSince = this.clock; }
  }
  /** Continuous marker movement (hold a key / wheel): dir in {-1, +1}. */
  nudge(id, dir, dtMs, stepsPerSec) {
    const e = this.entry(id);
    this.setPrice(id, e.priceF + dir * this.market.step * stepsPerSec * dtMs / 1000);
  }
  centralPrice() { return StoreSystem.centralPrice(this.market, this.state.store.stock[this.market.id] || 0); }

  _updateStore() {
    const stock = this.state.store.stock[this.market.id] || 0;
    const sb = this.entry('store-b'); const ss = this.entry('store-s');
    const central = this.centralPrice();
    const idle = this.t - this.lastActivity;
    // [PROVISIONAL] after 5 s without trades the store closes its spread one step every 2 s, but never past the central price.
    const n = this.stage === 'trade' && idle >= CONFIG.AUCTION.storeIdleMs ? 1 + Math.floor((idle - CONFIG.AUCTION.storeIdleMs) / CONFIG.AUCTION.storeNudgeMs) : 0;
    const step = this.market.step;
    const put = (e, v) => { const p = clamp(v, this.market.minPrice, this.market.maxPrice); if (p !== e.price) { e.price = p; e.priceSince = this.clock; } e.priceF = p; };
    put(ss, Math.max(StoreSystem.ask(this.market, stock) - n * step, central));
    put(sb, Math.min(StoreSystem.bid(this.market, stock) + n * step, central));
    ss.role = stock >= 1 ? ROLE.SELLER : ROLE.OUT;
    sb.role = stock < CONFIG.AUCTION.storeBuyCap ? ROLE.BUYER : ROLE.OUT;
    // When the store gets stock back, colonist markers fall back under the store ceiling.
    const cap = this.playerMax();
    this.colonistEntries.forEach((c) => { if (c.priceF > cap) this.setPrice(c.id, c.priceF); });
    this.storeStock = stock;
  }

  _worth(ownerId) { const p = playerById(this.state, ownerId); return p ? ScoringSystem.netWorth(this.state, p) : 0; }
  /**
   * Same price: colonists before the store, then [manual] the colonist with LESS net worth ("the player with the least amount of
   * money, land and goods always gets the advantage"), then [PROVISIONAL] the longest waiting and a seeded key.
   */
  _order(list, dir) {
    const worth = new Map(list.map((e) => [e.id, e.isStore ? 0 : this._worth(e.ownerId)]));
    return list.slice().sort((a, b) => dir * (a.price - b.price) || (a.isStore - b.isStore) || (worth.get(a.id) - worth.get(b.id)) || (a.roleSince - b.roleSince) || (a.tie - b.tie));
  }

  /** First crossing pair whose trade would actually be allowed right now. */
  _findPair() {
    const buyers = this._order(this.entries.filter((e) => e.role === ROLE.BUYER), -1);
    const sellers = this._order(this.entries.filter((e) => e.role === ROLE.SELLER), 1);
    for (const b of buyers) {
      for (const s of sellers) {
        if (b.ownerId === s.ownerId || b.price < s.price) continue;
        const price = this._tradePrice(b, s);
        if (this._check(b, s, price).ok) return { b, s, price };
      }
    }
    return null;
  }
  /**
   * [manual] trading happens where the buy line and the sell line meet: the price of the marker that was already resting there (the
   * other one moved into it). [PROVISIONAL] approximation when both markers reached their price in the same tick: rounded midpoint.
   */
  _tradePrice(b, s) {
    if (b.priceSince < s.priceSince) return b.price;
    if (s.priceSince < b.priceSince) return s.price;
    return Math.round((b.price + s.price) / 2);
  }
  _check(b, s, price) {
    const lot = this.market.createLot(this.state, s.ownerId);
    if (!lot.transferable) return { ok: false, reason: 'no_stock' };
    if (b.isStore) { if ((this.state.store.stock[this.market.id] || 0) >= CONFIG.AUCTION.storeBuyCap) return { ok: false, reason: 'store_full' }; }
    else if (ResourceLedger.cash(this.state, b.ownerId) < price) return { ok: false, reason: 'no_cash' };
    return { ok: true, lot };
  }

  /** Atomic: either item AND credits move, or nothing changes. */
  tryTrade(b, s, price = this._tradePrice(b, s)) {
    const chk = this._check(b, s, price);
    if (!chk.ok) return { ok: false, reason: chk.reason };
    if (!chk.lot.transfer(this.state, b.ownerId)) return { ok: false, reason: 'no_stock' };
    if (!ResourceLedger.moveCash(this.state, b.ownerId, s.ownerId, price)) {
      ResourceLedger.moveItem(this.state, this.market.id, b.ownerId, s.ownerId, 1); // rollback
      return { ok: false, reason: 'no_cash' };
    }
    this.volume += 1; this.sum += price;
    this.min = this.min === null ? price : Math.min(this.min, price);
    this.max = this.max === null ? price : Math.max(this.max, price);
    this.trades.push({ t: this.t, price, buyer: b.ownerId, seller: s.ownerId });
    this.lastActivity = this.t;
    // [PROVISIONAL] both markers are pushed apart so the same pair does not instantly trade again (see README).
    const gap = CONFIG.AUCTION.separateSteps * this.market.step;
    this.setPrice(b.id, b.priceF - gap); this.setPrice(s.id, s.priceF + gap);
    b.roleSince = s.roleSince = this.clock;
    if (this.onTrade) this.onTrade({ buyer: b.ownerId, seller: s.ownerId, price });
    return { ok: true, price };
  }

  _possible() {
    const res = this.market.id;
    const sellers = this.entries.filter((e) => !e.isStore || (this.state.store.stock[res] || 0) >= 1).filter((e) => this.market.createLot(this.state, e.ownerId).transferable);
    const buyers = this.entries.filter((e) => e.isStore ? (this.state.store.stock[res] || 0) < CONFIG.AUCTION.storeBuyCap : ResourceLedger.cash(this.state, e.ownerId) >= this.market.minPrice);
    return sellers.some((s) => buyers.some((b) => b.ownerId !== s.ownerId));
  }

  update(dt) {
    if (this.ended) return;
    if (this.stage === 'declare') {
      this.declareLeft -= dt;
      if (this.declareLeft > 0) { this.clock += dt; if (this.withStore) this._updateStore(); return; }
      // The rest of this tick already belongs to the trade stage.
      const over = -this.declareLeft;
      this.clock += dt - over; this.declareLeft = 0; this.stage = 'trade';
      dt = over;
      if (dt <= 0) return;
    }
    this.clock += dt; this.t += dt;
    if (this.withStore) this._updateStore();
    const pair = this._findPair();
    if (pair) {
      const key = `${pair.b.id}|${pair.s.id}`;
      this.crossMs = key === this.crossKey ? this.crossMs + dt : dt;
      this.crossKey = key;
      // Only a bid >= ask held continuously for 500 ms closes a deal.
      if (this.crossMs >= CONFIG.AUCTION.matchMs) { this.tryTrade(pair.b, pair.s, pair.price); this.crossMs = 0; this.crossKey = null; }
    } else { this.crossMs = 0; this.crossKey = null; }
    this.allOutMs = this.colonistEntries.every((e) => e.role === ROLE.OUT) ? this.allOutMs + dt : 0;
    this.noOpMs = this._possible() ? 0 : this.noOpMs + dt;
    if (this.t >= CONFIG.AUCTION.maxMs) this._end('time');
    else if (this.allOutMs >= CONFIG.AUCTION.allOutMs) this._end('all_out');
    else if (this.noOpMs >= CONFIG.AUCTION.noOpMs) this._end('no_ops');
  }
  _end(reason) { this.ended = true; this.endReason = reason; }
  get result() {
    return { res: this.market.id, volume: this.volume, min: this.min, max: this.max, avg: this.volume ? Math.round(this.sum / this.volume) : null, reason: this.endReason };
  }
}

/** AI: sees only public state (prices, stock, markers) and its own inventory. Never the seed or future events. */
const AISystem = {
  profile(p) { return AI_PROFILES[p.aiProfile] || AI_PROFILES.conservative; },
  diff(state) { return CONFIG.DIFFICULTY[state.difficulty]; },
  rucCount(state, p) { return state.plots.filter((q) => q.ownerId === p.id && q.ruc).length; },
  nonEnergyRucs(state, p) { return state.plots.filter((q) => q.ownerId === p.id && q.ruc && q.ruc.module !== 'energy').length; },
  expectedProd(state, p, res) {
    return state.plots.filter((q) => q.ownerId === p.id && q.ruc && q.ruc.module === res).reduce((s, q) => s + ProductionSystem.expectedYield(state, q), 0);
  },
  /** Units worth keeping for next turn. Turn 12 is the last one: nothing left to protect, so sell everything. */
  reserve(state, p, res) {
    if (state.turn >= CONFIG.TURNS) return 0;
    const min = this.diff(state).minReserve; const prof = this.profile(p);
    if (res === 'food') {
      const need = Math.max(0, ConsumptionSystem.foodNeed(state.turn + 1) - this.expectedProd(state, p, 'food'));
      return Math.max(min, need + (prof.extremeGuard ? 2 : 0));
    }
    // [manual] critical energy level: non-energy plots with a M.U.L.E. + 1 (energy made next turn arrives too late to power them).
    if (res === 'energy') return Math.max(min, this.nonEnergyRucs(state, p) + 1);
    return 0;
  },
  /** The role a colonist starts the declaration with: [manual] "If you have a surplus ... your character will automatically jump to SELL". */
  defaultRole(state, p, res) {
    const critical = res === 'food' ? ConsumptionSystem.foodNeed(Math.min(CONFIG.TURNS, state.turn + 1)) : res === 'energy' ? this.nonEnergyRucs(state, p) + 1 : 0;
    return (p.inventory[res] || 0) > critical ? ROLE.SELLER : ROLE.BUYER;
  },
  createBrain(state, rng, p) {
    const d = this.diff(state);
    return { id: p.id, role: ROLE.OUT, target: null, nextDecisionAt: rng.range(d.reactMin, d.reactMax), nextMoveAt: 0 };
  },
  /** Picks role + target price. Prices drift from an optimistic start toward the store's price as time passes. */
  decide(state, rng, p, engine) {
    const def = engine.market; const res = def.id;
    const prof = this.profile(p); const d = this.diff(state);
    const inv = p.inventory[res] || 0; const reserve = this.reserve(state, p, res);
    const stock = state.store.stock[res] || 0;
    const central = StoreSystem.centralPrice(def, stock);
    const err = (rng.next() * 2 - 1) * d.valuationErr / 100;
    const val = central * (1 + err);
    const progress = clamp(engine.t / (CONFIG.AUCTION.maxMs * 0.7), 0, 1);
    const storeBid = StoreSystem.bid(def, stock); const storeAsk = StoreSystem.ask(def, stock);
    const cap = (price) => prof.extremeGuard ? clamp(price, def.basePrice * 0.7, def.basePrice * 1.4) : price;
    const cash = p.cash;
    if (inv > reserve) {
      let margin = prof.margin;
      if (p.aiProfile === 'opportunist' && storeAsk > def.basePrice * 1.15) margin *= 1.5;
      const start = val * (1 + margin / 100);
      let floor = storeBid;
      if (p.aiProfile === 'industrial' && res === 'smithore') floor = Math.max(storeBid, val * 0.9);
      return { role: ROLE.SELLER, target: cap(start - (start - floor) * progress) };
    }
    const desperate = (res === 'food' && inv < ConsumptionSystem.foodNeed(state.turn + 1) - this.expectedProd(state, p, 'food')) || (res === 'energy' && inv < this.nonEnergyRucs(state, p));
    const speculate = p.aiProfile === 'opportunist' && inv < reserve + 6 && central < def.basePrice * 0.85 && cash > 500 && state.turn < CONFIG.TURNS;
    if (inv < reserve || speculate) {
      const start = val * (1 - (speculate ? 10 : prof.margin) / 100);
      // Only starvation / blackout justifies bidding past the store price (up to the store ceiling, never to the UI limit).
      const ceiling = desperate ? def.maxPrice : storeAsk;
      let bid = cap(start + (ceiling - start) * progress);
      const safety = desperate ? 0 : 120;
      bid = Math.min(bid, cash - safety);
      if (bid < def.minPrice) return { role: ROLE.OUT, target: null };
      return { role: ROLE.BUYER, target: bid };
    }
    return { role: ROLE.OUT, target: null };
  },
  /**
   * Declares during the declaration and moves the marker gradually during the trade stage, honouring reaction latency and the 1.5 s
   * decision hold. Roles are fixed after the declaration: an AI that changes its mind retreats instead of switching sides.
   */
  tick(state, rng, p, brain, engine, dt) {
    const e = engine.entry(p.id);
    if (engine.clock >= brain.nextDecisionAt) {
      const d = this.decide(state, rng, p, engine);
      const d0 = this.diff(state);
      brain.nextDecisionAt = engine.clock + Math.max(CONFIG.AUCTION.aiHoldMs, rng.range(d0.reactMin, d0.reactMax));
      if (engine.canDeclare()) { engine.setRole(p.id, d.role); brain.role = d.role; brain.target = d.target; }
      else {
        brain.role = e.role;
        if (e.role === ROLE.OUT) brain.target = null;
        else if (d.role === e.role) brain.target = d.target;
        else brain.target = e.role === ROLE.SELLER ? engine.market.maxPrice : engine.market.minPrice;
      }
    }
    if (engine.stage !== 'trade') return;
    brain.nextMoveAt -= dt;
    if (brain.target !== null && e.role !== ROLE.OUT) {
      while (brain.nextMoveAt <= 0) {
        brain.nextMoveAt += CONFIG.AUCTION.aiMoveMs;
        const diff = brain.target - e.priceF;
        const s = engine.market.step;
        if (Math.abs(diff) >= s) engine.setPrice(p.id, e.priceF + Math.sign(diff) * s);
      }
    } else brain.nextMoveAt = 0;
  },
  /**
   * Development for AI colonists (also used by the autopilot for the human). [manual] the computer players are not shown walking
   * ("they are boring to watch"), so this happens at once, but through the same store rules: robot from the corral, outfit, install.
   */
  develop(state, rng, p) {
    const prof = this.profile(p);
    const reserveCash = { conservative: 320, industrial: 160, opportunist: 220 }[p.aiProfile] || 250;
    const maxInstalls = { conservative: 1, industrial: 2, opportunist: 2 }[p.aiProfile] || 1;
    const actions = [];
    for (let n = 0; n < maxInstalls; n++) {
      const free = state.plots.filter((q) => q.ownerId === p.id && !q.ruc);
      if (!free.length || state.store.ruc < 1 || state.turn >= CONFIG.TURNS) break;
      // Energy RUCs power themselves; every other RUC needs 1 energy from the reserve (plus the new one, plus 1 of margin).
      const energyOk = p.inventory.energy + this.expectedProd(state, p, 'energy') >= this.nonEnergyRucs(state, p) + 2;
      const nextNeed = ConsumptionSystem.foodNeed(Math.min(CONFIG.TURNS, state.turn + 1));
      const foodOk = p.inventory.food + this.expectedProd(state, p, 'food') >= nextNeed + 1;
      let module = !energyOk ? 'energy' : !foodOk ? 'food' : prof.prefers;
      if (module === 'smithore' && !free.some((q) => q.terrain === TERRAIN.MOUNTAIN)) module = 'food';
      const mine = (q) => (x) => x.ownerId === p.id && x.ruc && x.ruc.module === module;
      const scored = free.map((q) => ({ q, s: ProductionSystem.baseYield(q, module) * 10 + (Plot.neighbours(state.plots, q).some(mine(q)) ? 5 : 0) + rng.next() }));
      const plot = scored.sort((a, b) => b.s - a.s)[0].q;
      // The chosen plot may yield nothing for that module (e.g. smithore on the river): fall back to what it does yield.
      if (!ProductionSystem.canProduce(plot, module) || ProductionSystem.baseYield(plot, module) === 0) {
        module = ['energy', 'food', 'smithore'].find((m) => ProductionSystem.canProduce(plot, m) && ProductionSystem.baseYield(plot, m) > 0);
      }
      const cost = StoreSystem.rucPrice(state) + CONFIG.MODULE_COST[module];
      if (p.cash < cost + reserveCash) break;
      const r = StoreSystem.buyRuc(state, p.id); if (!r.ok) break;
      const m = StoreSystem.buyModule(state, p.id, module);
      if (!m.ok) { StoreSystem.refundRuc(state, p.id, r.price); break; }
      StoreSystem.install(state, p.id, plot.id, { module, paid: r.price });
      actions.push({ plotId: plot.id, module });
    }
    return actions;
  }
};

/**
 * [manual] Development order: from the leader to the last colonist by net worth ("the last place player moves last"), reversed
 * ("moves first") when there are fewer than 7 M.U.L.E.s in the corral. Worked out once when development starts, kept in the save.
 * Ties: [PROVISIONAL] stable by player order.
 */
const DevOrder = {
  create(state) {
    const w = new Map(state.players.map((p) => [p.id, ScoringSystem.netWorth(state, p)]));
    const order = state.players.map((p, i) => ({ id: p.id, i })).sort((a, b) => (w.get(b.id) - w.get(a.id)) || (a.i - b.i)).map((x) => x.id);
    const reversed = state.store.ruc < CONFIG.DEV.lowCorral;
    return { order: reversed ? order.reverse() : order, reversed, corral: state.store.ruc, idx: 0, slot: null };
  }
};

/**
 * Town interior, in logical px of the map rectangle. [PROVISIONAL] layout (not the C64 geometry): a street across the town, a
 * passage from top to bottom, the three Phase A outfitting shops and the corral. No land office, assay office or pub (see README).
 */
// `spot`: the interior counter a colonist must actually walk up to before a shop/corral visit does anything (see moveTown). It
// sits well past the doorway, deep inside the room, so a step that only grazes the threshold while walking the street never
// triggers a purchase by accident — reaching it takes real, visible walking time, both going in and coming back out.
const TOWN = deepFreeze({
  W: CONFIG.COLS * CONFIG.TILE, H: CONFIG.ROWS * CONFIG.TILE, streetTop: 170, streetBottom: 310, passX0: 384, passX1: 480,
  buildings: [
    { id: 'shop_food', kind: 'shop', res: 'food', label: 'Taller de menjar', x: 24, y: 16, w: 170, h: 154, door: 'bottom', spot: { x: 109, y: 66 } },
    { id: 'shop_energy', kind: 'shop', res: 'energy', label: 'Taller d\'energia', x: 204, y: 16, w: 170, h: 154, door: 'bottom', spot: { x: 289, y: 66 } },
    { id: 'shop_smithore', kind: 'shop', res: 'smithore', label: 'Taller de smithore', x: 490, y: 16, w: 170, h: 154, door: 'bottom', spot: { x: 575, y: 66 } },
    { id: 'corral', kind: 'corral', label: 'Corral de RUCs', x: 490, y: 310, w: 350, h: 154, door: 'top', spot: { x: 665, y: 414 } }
  ]
});

/**
 * The human colonist walking during development (pure logic, plain JSON state kept in the save). Movement runs in fixed 10 ms
 * steps; the development clock keeps running while walking, inside buildings or standing still.
 * [manual]: get a M.U.L.E. in the corral, take it to an outfitting shop ("go all the way in and come all the way out"), lead it to
 * your plot and press the button over the house. Pressing anywhere else outside town, or running out of time while leading it,
 * makes it run away. Taking it back into the corral refunds the robot, never the outfitting.
 */
const DevWalk = {
  townTile() { return { x: CONFIG.RIVER_COL * CONFIG.TILE, y: CONFIG.TOWN_ROW * CONFIG.TILE, w: CONFIG.TILE, h: CONFIG.TILE }; },
  create(state, pid, timeMs) {
    return {
      pid, area: 'town', x: (TOWN.passX0 + TOWN.passX1) / 2, y: (TOWN.streetTop + TOWN.streetBottom) / 2,
      carrying: null, latch: null, pressT: 0, visited: false, visiting: null, installing: null, fleeing: null, endWhy: null,
      timeLeft: timeMs, timeTotal: timeMs, acc: 0, ended: null, msg: '', bad: false, log: [], seq: 0
    };
  },
  plotAt(state, x, y) {
    const c = clamp(Math.floor(x / CONFIG.TILE), 0, CONFIG.COLS - 1); const r = clamp(Math.floor(y / CONFIG.TILE), 0, CONFIG.ROWS - 1);
    return state.plots[r * CONFIG.COLS + c];
  },
  /** "At the house" = anywhere on that plot's own tile — the whole square, not a small spot at its centre. */
  atHouse(w, plot) {
    const px = plot.x * CONFIG.TILE; const py = plot.y * CONFIG.TILE;
    return w.x >= px && w.x < px + CONFIG.TILE && w.y >= py && w.y < py + CONFIG.TILE;
  },
  inTownFloor(x, y) { return (y >= TOWN.streetTop && y <= TOWN.streetBottom) || (x >= TOWN.passX0 && x <= TOWN.passX1); },
  buildingAt(x, y) { return TOWN.buildings.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) || null; },
  speed(state, w) {
    if (w.area === 'town') return CONFIG.WALK.townSpeed;
    const p = this.plotAt(state, w.x, w.y);
    const slow = p.terrain === TERRAIN.RIVER || p.terrain === TERRAIN.MOUNTAIN;
    return CONFIG.WALK.mapSpeed * (slow ? CONFIG.WALK.slowPct : 100) / 100;
  },
  /**
   * dir: { x, y } with each axis in {-1, 0, 1}. Movement and actions are suspended while `installing` or `fleeing` play out
   * (busy states); the development clock keeps running regardless, same as walking or standing still.
   */
  update(state, w, dir, dtMs) {
    if (w.ended) return;
    w.acc += dtMs;
    while (w.acc >= CONFIG.WALK.stepMs && !w.ended) {
      w.acc -= CONFIG.WALK.stepMs;
      w.timeLeft -= CONFIG.WALK.stepMs;
      if (w.installing) { w.installing.t += CONFIG.WALK.stepMs; if (w.installing.t >= CONFIG.WALK.installMs) this.finishInstall(state, w); }
      else if (w.fleeing) { w.fleeing.t += CONFIG.WALK.stepMs; if (w.fleeing.t >= CONFIG.WALK.fleeShuffleMs + CONFIG.WALK.fleeRunMs) this.finishFlee(w); }
      else if (w.visiting) { w.visiting.t += CONFIG.WALK.stepMs; this.stepVisit(state, w); }
      else if (dir.x || dir.y) this.move(state, w, dir);
      if (w.timeLeft <= 0) this.end(state, w, 'timeout');
    }
  },
  move(state, w, dir) {
    const d = this.speed(state, w) * CONFIG.WALK.stepMs;
    const nx = w.x + dir.x * d; const ny = w.y + dir.y * d;
    // Latch/spot bookkeeping for buildings lives entirely in moveTown now (entering and leaving are both free, gradual movement).
    if (w.area === 'town') this.moveTown(state, w, nx, ny); else this.moveMap(state, w, nx, ny);
  },
  moveMap(state, w, nx, ny) {
    nx = clamp(nx, 0, TOWN.W - 0.01); ny = clamp(ny, 0, TOWN.H - 0.01);
    const t = this.townTile();
    if (nx >= t.x && nx < t.x + t.w && ny >= t.y && ny < t.y + t.h) {
      // Stepping onto the town tile zooms into the town, arriving through the matching edge.
      const fromW = w.x < t.x; const fromE = w.x >= t.x + t.w;
      w.area = 'town';
      if (fromW || fromE) {
        w.x = fromW ? 1 : TOWN.W - 1;
        w.y = TOWN.streetTop + clamp((ny - t.y) / t.h, 0, 1) * (TOWN.streetBottom - TOWN.streetTop);
      } else {
        w.y = w.y < t.y ? 1 : TOWN.H - 1;
        w.x = TOWN.passX0 + clamp((nx - t.x) / t.w, 0, 1) * (TOWN.passX1 - TOWN.passX0);
      }
      return;
    }
    w.x = nx; w.y = ny;
  },
  moveTown(state, w, nx, ny) {
    const t = this.townTile();
    if (nx < 0 || nx > TOWN.W || ny < 0 || ny > TOWN.H) {
      // Leaving through an open edge: back on the map, just outside the town tile.
      const sy = clamp((w.y - TOWN.streetTop) / (TOWN.streetBottom - TOWN.streetTop), 0, 1);
      const sx = clamp((w.x - TOWN.passX0) / (TOWN.passX1 - TOWN.passX0), 0, 1);
      w.area = 'map'; w.latch = null; w.pressT = 0; w.visited = false;
      if (nx < 0) { w.x = t.x - 1; w.y = t.y + sy * (t.h - 1); } else if (nx > TOWN.W) { w.x = t.x + t.w; w.y = t.y + sy * (t.h - 1); } else if (ny < 0) { w.y = t.y - 1; w.x = t.x + sx * (t.w - 1); } else { w.y = t.y + t.h; w.x = t.x + sx * (t.w - 1); }
      return;
    }
    const b = this.buildingAt(nx, ny);
    if (b) {
      // The colonist never actually walks in: they stay right at this doorway (their position never adopts nx, ny) and only
      // the RUC itself goes on to the counter, once genuinely pushing into the door for CONFIG.WALK.doorHoldMs has committed
      // to a visit (see startVisit / MapScreen.drawVisiting) — a brief graze while walking the street falls short of that and
      // does nothing. One visit per approach: holding the door afterwards does not start another.
      if (w.visiting) return;
      if (w.latch !== b.id) { w.latch = b.id; w.pressT = 0; w.visited = false; }
      if (w.visited) return;
      w.pressT += CONFIG.WALK.stepMs;
      if (w.pressT >= CONFIG.WALK.doorHoldMs) { w.visited = true; this.startVisit(state, w, b); }
      return;
    }
    if (w.latch) { w.latch = null; w.pressT = 0; w.visited = false; }
    if (this.inTownFloor(nx, ny)) { w.x = nx; w.y = ny; return; }
    // Walls (and the building just left): slide along them.
    if (!this.buildingAt(nx, w.y) && this.inTownFloor(nx, w.y)) { w.x = nx; return; }
    if (!this.buildingAt(w.x, ny) && this.inTownFloor(w.x, ny)) w.y = ny;
  },
  /** Starts the scripted visit; the actual effect (buy/refund/outfit) applies at the midpoint, see stepVisit. */
  startVisit(state, w, b) { w.visiting = { id: b.id, t: 0, phase: 'in' }; },
  stepVisit(state, w) {
    const half = CONFIG.WALK.visitMs / 2;
    if (w.visiting.phase === 'in' && w.visiting.t >= half) {
      w.visiting.phase = 'out';
      this.enter(state, w, TOWN.buildings.find((x) => x.id === w.visiting.id));
    }
    if (w.visiting.t >= CONFIG.WALK.visitMs) w.visiting = null;
  },
  say(w, msg, bad = false, kind = null) { w.msg = msg; w.bad = bad; w.seq += 1; if (kind) w.log.push(kind); return kind; },
  enter(state, w, b) {
    w.latch = b.id;
    if (b.kind === 'corral') {
      if (w.carrying) {
        const back = StoreSystem.refundRuc(state, w.pid, w.carrying.paid); const mod = w.carrying.module;
        w.carrying = null;
        return this.say(w, `RUC retornat al corral: +${back} cr${mod ? ` (l'equip de ${resLabel(mod).toLowerCase()} no es retorna)` : ''}.`, false, 'return');
      }
      const r = StoreSystem.buyRuc(state, w.pid);
      if (!r.ok) return this.say(w, r.reason === 'no_cash' ? 'No tens prou crèdits per a un RUC.' : 'El corral és buit: no queden RUCs.', true);
      w.carrying = { module: null, paid: r.price };
      return this.say(w, `Has comprat un RUC per ${r.price} cr. Porta'l a un taller per equipar-lo.`, false, 'buy');
    }
    if (!w.carrying) return this.say(w, 'Primer cal treure un RUC del corral.', true);
    if (w.carrying.module === b.res) return this.say(w, `Aquest RUC ja està equipat per a ${resLabel(b.res).toLowerCase()}.`, true);
    const m = StoreSystem.buyModule(state, w.pid, b.res);
    if (!m.ok) return this.say(w, 'No tens prou crèdits per a aquest equip.', true);
    w.carrying.module = b.res;
    return this.say(w, `RUC equipat per a ${resLabel(b.res).toLowerCase()}: -${m.price} cr. Porta'l a la casa d'una parcel·la teva.`, false, 'outfit');
  },
  /** The "joystick button" (Enter / Space / Acció). It only does something on the map; clicks on the map never call it. */
  act(state, w) {
    if (w.ended || w.installing || w.fleeing) return null; // busy: already installing or fleeing
    if (w.area !== 'map') return this.say(w, 'Al poble, entra als edificis caminant-hi.', true);
    const plot = this.plotAt(state, w.x, w.y); const own = plot.ownerId === w.pid; const house = this.atHouse(w, plot);
    if (!w.carrying) {
      if (house && own && plot.ruc) {
        w.carrying = { module: plot.ruc.module, paid: plot.ruc.paid }; plot.ruc = null;
        return this.say(w, `Has retirat el RUC de la parcel·la #${plot.id + 1}: ara et segueix.`, false, 'pickup');
      }
      return this.say(w, 'Aquí no hi ha res a fer.', true);
    }
    if (house && own) {
      if (!w.carrying.module) return this.say(w, 'Aquest RUC no està equipat: porta\'l abans a un taller.', true);
      // Not instant: the RUC rises to the house, the module is added, then it comes back down (finishInstall applies the change).
      w.installing = { plotId: plot.id, ruc: w.carrying, t: 0 };
      w.carrying = null;
      return this.say(w, `Instal·lant el RUC a la parcel·la #${plot.id + 1}...`, false, 'installing');
    }
    // [manual] Standard: pressing the button anywhere but over the house of your own plot makes the M.U.L.E. run away.
    return this.flee(state, w, 'Has premut fora de la casa d\'una parcel·la teva: el RUC ha fugit!');
  },
  /** Applies the deferred install once the rise/add/descend animation has played (see `act`). */
  finishInstall(state, w) {
    const { plotId, ruc } = w.installing;
    const r = StoreSystem.install(state, w.pid, plotId, ruc);
    w.carrying = r.previous ? { module: r.previous.module, paid: r.previous.paid } : null;
    w.installing = null;
    this.say(w, r.previous ? `RUC instal·lat a la parcel·la #${plotId + 1}; l'anterior ara et segueix.` : `RUC instal·lat a la parcel·la #${plotId + 1}.`, false, 'install');
  },
  /**
   * The RUC's own effect (lost for good, nothing refunded) applies at once; only the visual choreography — a quick jitter, then a
   * dash off in a random direction — is deferred (`w.fleeing`, resolved by `finishFlee`). The direction is derived from the current
   * state rather than drawn from the seeded PRNG, so it stays deterministic without disturbing that stream.
   */
  flee(state, w, msg) {
    const angle = (SeededRNG.hash(`flee|${state.turn}|${w.pid}|${Math.round(w.x)}|${Math.round(w.y)}|${w.timeLeft}`) % 360) * Math.PI / 180;
    w.fleeing = { t: 0, angle };
    w.carrying = null;
    StoreSystem.loseRuc(state);
    return this.say(w, msg, true, 'flee');
  },
  /** Resolves a deferred `end()` (see below) once the flee animation is done. */
  finishFlee(w) {
    w.fleeing = null;
    if (w.endWhy) { const why = w.endWhy; w.endWhy = null; w.ended = why; w.timeLeft = Math.max(0, w.timeLeft); }
  },
  /**
   * End of the colonist's development (time out or voluntary): a RUC still being led runs away ([manual]); nothing is refunded.
   * If it was mid-install, that install is completed first (a leftover previous module, if any, flees instead). `w.ended` itself
   * is only set once any flee animation this triggers has played, so the turn queue does not move on before it is shown.
   */
  end(state, w, why) {
    if (w.ended || w.fleeing) return;
    if (w.installing) this.finishInstall(state, w);
    if (w.carrying) {
      this.flee(state, w, why === 'timeout' ? 'S\'ha acabat el temps amb el RUC a la mà: ha fugit.' : 'Has acabat el torn amb el RUC a la mà: ha fugit.');
      w.endWhy = why;
      return;
    }
    w.ended = why; w.timeLeft = Math.max(0, w.timeLeft);
  }
};

/** Walking direction from the held arrow keys and the on-screen pad (both work at once; opposite inputs cancel). */
function walkDirs(keys, pad = null) {
  const p = pad || { x: 0, y: 0 };
  const x = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0) + (p.x || 0);
  const y = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0) + (p.y || 0);
  return { x: Math.sign(x), y: Math.sign(y) };
}
