/** Static map layer (ground + terrain tiles) cached in an offscreen canvas; ownership and RUCs are drawn per frame. */
const MapLayer = {
  key: '',
  canvas: null,
  build(game) {
    const a = game.assets; const T = CONFIG.TILE;
    const c = document.createElement('canvas'); c.width = CONFIG.COLS * T; c.height = CONFIG.ROWS * T;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    a.draw(x, 'map_ground_base', 0, 0, c.width, c.height);
    game.state.plots.forEach((p) => {
      if (p.terrain === TERRAIN.TOWN) {
        a.draw(x, 'tile_river_01', p.x * T, p.y * T, T, T);
        a.drawContain(x, 'colony_store', p.x * T + 4, p.y * T + 4, T - 8, T - 30);
        x.fillStyle = 'rgba(6,9,18,0.8)'; x.fillRect(p.x * T + 3, p.y * T + T - 24, T - 6, 21);
        x.fillStyle = COL.amber; x.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace'; x.textBaseline = 'middle'; x.textAlign = 'center';
        x.fillText('POBLE', p.x * T + T / 2, p.y * T + T - 13);
        return;
      }
      const name = p.terrain === TERRAIN.RIVER ? (p.y % 2 ? 'tile_river_02' : 'tile_river_01')
        : p.terrain === TERRAIN.PLAIN ? ((p.x * 3 + p.y) % 2 ? 'tile_plain_02' : 'tile_plain_01')
          : (p.richness >= 2 ? 'tile_mountain_02' : 'tile_mountain_01');
      a.draw(x, name, p.x * T, p.y * T, T, T);
      // Terrain must never rely on colour alone: initial + richness pips are drawn on the tile.
      x.fillStyle = 'rgba(6,9,18,0.72)'; x.fillRect(p.x * T + 3, p.y * T + T - 24, p.terrain === TERRAIN.MOUNTAIN ? 56 : 30, 21);
      x.fillStyle = COL.text; x.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace'; x.textBaseline = 'middle'; x.textAlign = 'left';
      x.fillText(p.terrain === TERRAIN.RIVER ? 'R' : p.terrain === TERRAIN.PLAIN ? 'P' : 'M', p.x * T + 8, p.y * T + T - 13);
      for (let i = 0; i < p.richness; i++) { x.fillStyle = COL.amber; x.fillRect(p.x * T + 26 + i * 12, p.y * T + T - 18, 8, 10); }
    });
    return c;
  },
  get(game) {
    const k = `${game.state.seed}|${game.assets.settled}|${game.assets.failed.size}`;
    if (k !== this.key || !this.canvas) { this.canvas = this.build(game); this.key = k; }
    return this.canvas;
  }
};

const terrainName = (p) => ({ river: 'Riu', plain: 'Plana', mountain: 'Muntanya', town: 'Poble' }[p.terrain] || p.terrain);

class MapScreen {
  constructor() { this.cursor = 20; this.hover = null; }
  /**
   * Land race: Enter/Space anywhere is the "buzzer". Development: held arrows walk (polled every tick by Game.devDirs) and Enter/Space
   * is the colonist's action button. A focused panel / HUD button keeps its own Enter/Space.
   */
  onKey(game, e) {
    if (game.paused || game.helpOpen) return false;
    const f = game.renderer.focusId;
    const onButton = !!f && (f.startsWith('hud-') || f.startsWith('d-') || f.startsWith('dbg-'));
    const action = e.key === 'Enter' || e.key === ' ';
    if (game.turns.phase === 'LAND_GRANT') {
      if (!action || (onButton && !f.startsWith('d-'))) return false;
      game.humanClaim(); return true;
    }
    if (game.turns.phase === 'DEVELOPMENT') {
      const slot = game.devSlot();
      if (slot && slot.stage === 'card' && action && !onButton) { game.devSkipCard(); return true; }
      if (!game.humanWalk()) return false;
      if (e.key.startsWith('Arrow')) return true;
      if (action && !onButton) { game.devAction(); return true; }
    }
    return false;
  }
  /** Thick animated frame + corner brackets + label: the cursor never relies on colour alone. Animation runs on the game clock. */
  drawLandCursor(game, r, land) {
    const s = game.state; const c = r.ctx;
    if (land.lastClaim) {
      const age = land.clock - land.lastClaim.clock;
      if (age >= 0 && age < 800) {
        const o = playerById(s, land.lastClaim.pid); const pr = this.plotRect(s.plots[land.lastClaim.plot]); const k = age / 800;
        c.save(); c.globalAlpha = 1 - k; c.strokeStyle = o.color; c.lineWidth = 6; c.strokeRect(pr.x - k * 16, pr.y - k * 16, pr.w + k * 32, pr.h + k * 32);
        c.restore(); r.glyph(o.shape, pr.x + pr.w / 2, pr.y + pr.h / 2, 14 + (1 - k) * 8, o.color, '#05070d');
      }
    }
    if (land.cursor < 0) return;
    const rc = this.plotRect(s.plots[land.cursor]);
    // Reduce-motion removes the pulse only; it never changes how fast the cursor sweeps.
    const pulse = game.settings.reduceMotion ? 0 : Math.sin(land.clock / 90);
    const inset = 2 + (pulse + 1) * 1.5;
    c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(rc.x, rc.y, rc.w, rc.h);
    c.lineWidth = 7; c.strokeStyle = '#ffffff'; c.strokeRect(rc.x + inset + 3.5, rc.y + inset + 3.5, rc.w - 2 * inset - 7, rc.h - 2 * inset - 7);
    c.lineWidth = 3; c.strokeStyle = COL.amber; c.strokeRect(rc.x + inset + 8, rc.y + inset + 8, rc.w - 2 * inset - 16, rc.h - 2 * inset - 16);
    c.strokeStyle = '#000'; c.lineWidth = 6; const L = 20;
    [[rc.x, rc.y, 1, 1], [rc.x + rc.w, rc.y, -1, 1], [rc.x, rc.y + rc.h, 1, -1], [rc.x + rc.w, rc.y + rc.h, -1, -1]].forEach(([x, y, dx, dy]) => {
      c.strokeStyle = '#000'; c.lineWidth = 8; c.beginPath(); c.moveTo(x + dx * L, y); c.lineTo(x, y); c.lineTo(x, y + dy * L); c.stroke();
      c.strokeStyle = COL.amber; c.lineWidth = 4; c.beginPath(); c.moveTo(x + dx * L, y); c.lineTo(x, y); c.lineTo(x, y + dy * L); c.stroke();
    });
    r.panel(rc.x + 8, rc.y + rc.h / 2 - 12, rc.w - 16, 24, { fill: 'rgba(6,9,18,0.85)', frame: false });
    r.text('RECLAMA', rc.x + rc.w / 2, rc.y + rc.h / 2 - 9, { size: 16, color: COL.amber, align: 'center', shadow: false });
  }
  plotRect(p) { return { x: CONFIG.MAP_X + p.x * CONFIG.TILE, y: CONFIG.MAP_Y + p.y * CONFIG.TILE, w: CONFIG.TILE, h: CONFIG.TILE }; }
  plotAt(game, px, py) {
    const x = Math.floor((px - CONFIG.MAP_X) / CONFIG.TILE); const y = Math.floor((py - CONFIG.MAP_Y) / CONFIG.TILE);
    return x < 0 || y < 0 || x >= CONFIG.COLS || y >= CONFIG.ROWS ? null : game.state.plots[y * CONFIG.COLS + x];
  }
  /** Draws map + owners + RUCs. Reused by the production animation through `opts.plotFx`; `opts.walk` adds the houses to aim at. */
  drawMap(game, r, opts = {}) {
    const s = game.state; const ctx = r.ctx; const w = opts.walk;
    ctx.drawImage(MapLayer.get(game), CONFIG.MAP_X, CONFIG.MAP_Y);
    s.plots.forEach((p) => {
      const { x, y } = this.plotRect(p); const T = CONFIG.TILE;
      if (p.ownerId) {
        const o = playerById(s, p.ownerId);
        ctx.strokeStyle = o.color; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y + 2, T - 4, T - 4);
        r.glyph(o.shape, x + 14, y + 14, 9, o.color, '#05070d');

class ProductionScreen {
  constructor(map) { this.map = map; }
  draw(game, r) {
    const s = game.state; const prod = game.rt.prod; const T = CONFIG.TILE;
    r.asset('bg_irata_sky', 0, 0, CONFIG.W, CONFIG.H); r.dim(0.55);
    Hud.draw(game, r);
    r.text('Producció: menjar i smithore gasten 1 energia de la reserva; l\'energia s\'autoalimenta', 16, 66, { size: 20, color: COL.amber, maxW: 1240 });
    const order = prod.order; const t = prod.t;
    const t0 = 800; const t1 = prod.duration - 1300;
    const per = order.length ? (t1 - t0) / order.length : 1;
    const reached = new Map(); order.forEach((o, i) => reached.set(o.plotId, { o, at: t0 + i * per }));
    const fx = (plot) => {
      const rec = reached.get(plot.id);
      if (!rec) return null;
      const since = t - rec.at;
      return {
        walking: since >= 0 && since < 700 && rec.o.active,
        draw: (ctx, x, y) => {
          if (since < 0) return;
          const rise = clamp(since / 600, 0, 1);
          if (rec.o.active && rec.o.amount > 0) {
            r.icon(rec.o.module, x + 8, y + 8 - Math.round(rise * 8), 22);
            r.text(`+${rec.o.amount}`, x + 34, y + 10 - Math.round(rise * 8), { size: 18, color: COL.good });
          } else {
            ctx.fillStyle = 'rgba(6,9,18,0.8)'; ctx.fillRect(x + 4, y + 4, 88, 26);
            const why = rec.o.zeroed === 'pest' ? '✕ plaga' : rec.o.zeroed === 'breakdown' ? '✕ avaria' : rec.o.active ? '0' : '✕ sense E';
            r.text(why, x + 8, y + 8, { size: 16, color: COL.bad });
          }
        }
      };
    };
    this.map.drawMap(game, r, { plotFx: fx });
    // Dim every tile the animation has not reached yet.
    const ctx = r.ctx; ctx.fillStyle = 'rgba(4,6,14,0.62)';
    s.plots.forEach((p) => { const rec = reached.get(p.id); if (!rec || t < rec.at) ctx.fillRect(CONFIG.MAP_X + p.x * T, CONFIG.MAP_Y + p.y * T, T, T); });
    this.map.drawPlayers(game, r);
    const X = CONFIG.MAP_X; const Y = 590;
    r.panel(X, Y, 864, 122, {});
    if (t >= prod.duration - 1300 || game.settings.reduceMotion) {
      prod.reports.forEach((rep, i) => {
        const p = playerById(s, rep.playerId);
        r.text(`${p.name}: ${enabledResources().map((d) => `${d.label} +${rep.produced[d.id] || 0}`).join(' · ')}${rep.stopped ? ` · sense energia ${rep.stopped}` : ''}`, X + 12, Y + 8 + i * 25, { size: 18, color: p.isHuman ? COL.amber : COL.text, maxW: 700 });
      });
      r.button('prod-next', 'Continuar', X + 720, Y + 76, 132, 38, { primary: true, onClick: () => game.skipPhase() });
    } else {
      r.bar(X + 12, Y + 50, 840, 14, t / prod.duration, COL.cyan);
      r.text('Els RUCs treballen...', X + 12, Y + 12, { size: 18 });
      r.button('prod-skip', 'Salta', X + 720, Y + 76, 132, 38, { onClick: () => game.skipPhase() });
    }
    if (game.debug) game.drawDebugBar(r);
  }
}

const AUC = { axisX: 100, lanesX: 120, laneStep: 152, laneW: 146, storeX: 736, storeW: 140, sliderX: 912, top: 156, bottom: 556, statsX: 984 };

class AuctionScreen {
  /** The price axis is a window [lo, hi] that only grows during an auction (colonists may bid past the store ceiling). */
  priceY(v, price) { return AUC.bottom - (price - v.lo) / (v.hi - v.lo) * (AUC.bottom - AUC.top); }
  yPrice(v, y) { return v.lo + (AUC.bottom - y) / (AUC.bottom - AUC.top) * (v.hi - v.lo); }
  laneX(i) { return AUC.lanesX + i * AUC.laneStep; }
  /** Declaration: ↑/→ seller, ↓/← buyer, Space in/out. Trade stage: held ↑/↓ are polled by Game.updateAuctionInput. */
  onKey(game, e) {
    const a = game.rt.auction; if (!a || a.engine.ended || game.paused) return false;
    if (a.engine.canDeclare()) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { game.auctionRole(ROLE.SELLER); return true; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { game.auctionRole(ROLE.BUYER); return true; }
      if (e.key === ' ' || e.key === 'Spacebar') { game.auctionToggleOut(); return true; }
    }
    return e.key === 'ArrowUp' || e.key === 'ArrowDown';
  }
  drawMarker(r, kind, x, y, color, shape, dim) {
    const c = r.ctx; c.save(); c.globalAlpha = dim ? 0.55 : 1;
    c.fillStyle = color; c.strokeStyle = '#05070d'; c.lineWidth = 3; c.beginPath();
    if (kind === ROLE.BUYER) { c.moveTo(x - 10, y - 12); c.lineTo(x + 12, y); c.lineTo(x - 10, y + 12); } else { c.moveTo(x + 10, y - 12); c.lineTo(x - 12, y); c.lineTo(x + 10, y + 12); }
    c.closePath(); c.stroke(); c.fill(); c.restore();
    r.glyph(shape, x + (kind === ROLE.BUYER ? -2 : 2), y, 4, '#05070d', null);
  }
  draw(game, r) {
    const s = game.state; const a = game.rt.auction; const e = a.engine; const m = e.market; const human = s.players[0];
    const v = game.auctionView(); const py = (p) => clamp(this.priceY(v, p), AUC.top - 8, AUC.bottom + 8);
    const declaring = e.canDeclare(); const live = !game.paused && !e.ended;
    r.asset('auction_hall_bg', 0, 0, CONFIG.W, CONFIG.H); r.dim(0.35);
    Hud.draw(game, r);
    r.icon(m.id, 16, 62, 30);
    r.text(`Subhasta de ${m.label.toLowerCase()}`, 54, 64, { size: 24, color: COL.amber });
    if (declaring) {
      r.bar(400, 70, 560, 16, e.declareLeft / CONFIG.AUCTION.declareMs, COL.amber);
      r.text(`Declara ${fmtTime(e.declareLeft)}`, 972, 64, { size: 20, color: COL.amber });
    } else {
      const left = Math.max(0, CONFIG.AUCTION.maxMs - e.t);
      r.bar(400, 70, 560, 16, left / CONFIG.AUCTION.maxMs, left < 8000 ? COL.bad : COL.cyan);
      r.text(fmtTime(left), 972, 64, { size: 20 });
    }
    r.panel(AUC.axisX - 4, AUC.top - 26, AUC.storeX + AUC.storeW - AUC.axisX + 12, AUC.bottom - AUC.top + 80, { fill: 'rgba(6,9,18,0.55)', frame: false });
    // price axis
    const range = v.hi - v.lo; const tick = range > 400 ? 100 : range > 200 ? 40 : range > 120 ? 20 : 10;
    for (let p = Math.ceil(v.lo / tick) * tick; p <= v.hi; p += tick) {
      const y = this.priceY(v, p);
      r.ctx.strokeStyle = 'rgba(180,200,230,0.16)'; r.ctx.lineWidth = 1; r.ctx.beginPath(); r.ctx.moveTo(AUC.lanesX, y + 0.5); r.ctx.lineTo(AUC.storeX + AUC.storeW, y + 0.5); r.ctx.stroke();
      r.text(String(p), AUC.axisX - 6, y - 9, { size: 16, color: COL.dim, align: 'right' });
    }
    if (m.maxPrice <= v.hi) {
      const yc = this.priceY(v, m.maxPrice);
      r.ctx.strokeStyle = COL.bad; r.ctx.lineWidth = 1; r.ctx.beginPath(); r.ctx.moveTo(AUC.lanesX, yc); r.ctx.lineTo(AUC.storeX + AUC.storeW, yc); r.ctx.stroke();
      r.text(`sostre de botiga ${m.maxPrice}`, AUC.lanesX + 6, yc - 20, { size: 16, color: COL.bad });
    }
    const cy = py(e.centralPrice());
    r.ctx.setLineDash([10, 6]); r.ctx.strokeStyle = COL.amber; r.ctx.lineWidth = 2; r.ctx.beginPath(); r.ctx.moveTo(AUC.lanesX, cy); r.ctx.lineTo(AUC.storeX + AUC.storeW, cy); r.ctx.stroke(); r.ctx.setLineDash([]);
    r.text(`preu botiga ${e.centralPrice()}`, this.laneX(2) + 6, cy - 20, { size: 16, color: COL.amber });
    // lanes
    s.players.forEach((p, i) => {
      const lx = this.laneX(i); const en = e.entry(p.id);
      r.ctx.strokeStyle = p.color; r.ctx.globalAlpha = 0.35; r.ctx.lineWidth = 2; r.ctx.strokeRect(lx + 0.5, AUC.top - 24, AUC.laneW, AUC.bottom - AUC.top + 48); r.ctx.globalAlpha = 1;
      r.glyph(p.shape, lx + 14, AUC.top - 40, 8, p.color, '#05070d');
      r.text(p.name, lx + 28, AUC.top - 50, { size: 16, maxW: 110 });
      r.text(en.role === ROLE.BUYER ? 'COMPRADOR' : en.role === ROLE.SELLER ? 'VENEDOR' : 'FORA', lx + 6, AUC.top - 26, { size: 16, color: en.role === ROLE.OUT ? COL.dim : COL.text });
      if (en.role === ROLE.OUT) {
        r.ctx.strokeStyle = COL.dim; r.ctx.lineWidth = 2; r.ctx.beginPath(); r.ctx.arc(lx + AUC.laneW / 2 - 16, AUC.bottom + 14, 8, 0, Math.PI * 2); r.ctx.stroke();
        r.text('fora', lx + AUC.laneW / 2 - 2, AUC.bottom + 6, { size: 16, color: COL.dim });
      } else {
        const y = py(en.price); const bx = lx + (en.role === ROLE.BUYER ? 36 : 110);
        this.drawMarker(r, en.role, bx, y, p.color, p.shape, declaring);
        r.text(String(en.price), en.role === ROLE.BUYER ? bx + 16 : bx - 46, y - 9, { size: 16 });
      }
      r.text(`${p.inventory[m.id]}u · ${p.cash}cr`, lx + 6, AUC.bottom + 28, { size: 16, color: COL.dim, maxW: AUC.laneW - 8 });
    });
    // store lane
    const sb = e.entry('store-b'); const ss = e.entry('store-s'); const sx = AUC.storeX; const stock = s.store.stock[m.id] || 0;
    r.ctx.strokeStyle = COL.amber; r.ctx.globalAlpha = 0.5; r.ctx.lineWidth = 2; r.ctx.strokeRect(sx + 0.5, AUC.top - 24, AUC.storeW, AUC.bottom - AUC.top + 48); r.ctx.globalAlpha = 1;
    r.text('BOTIGA', sx + 6, AUC.top - 50, { size: 16, color: COL.amber });
    r.text(`estoc ${stock}`, sx + 6, AUC.top - 26, { size: 16, color: COL.dim });
    if (sb.role !== ROLE.OUT) { this.drawMarker(r, ROLE.BUYER, sx + 34, py(sb.price), COL.amber, 'square', declaring); r.text(String(sb.price), sx + 50, py(sb.price) - 9, { size: 16 }); }
    if (ss.role !== ROLE.OUT) { this.drawMarker(r, ROLE.SELLER, sx + 104, py(ss.price), COL.amber, 'square', declaring); r.text(String(ss.price), sx + 58, py(ss.price) - 9, { size: 16 }); }
    if (!stock) r.wrap('Sense estoc: preu lliure', sx + 6, AUC.bottom + 6, AUC.storeW - 10, 18, { size: 16, color: COL.bad });
    // crossing indicator: the two markers glow and a bar shows progress towards the 500 ms hold
    if (e.crossKey) {
      const [bid, sid] = e.crossKey.split('|'); const eb = e.entry(bid); const es = e.entry(sid);
      const pos = (en) => { if (en.isStore) return { x: en.id === 'store-b' ? sx + 34 : sx + 104, y: py(en.price) }; const i = s.players.findIndex((q) => q.id === en.id); return { x: this.laneX(i) + (en.role === ROLE.BUYER ? 36 : 110), y: py(en.price) }; };
      const pb = pos(eb); const ps = pos(es);
      r.ctx.strokeStyle = COL.good; r.ctx.lineWidth = 4; r.ctx.beginPath(); r.ctx.moveTo(pb.x, pb.y); r.ctx.lineTo(ps.x, ps.y); r.ctx.stroke();
      const mx = (pb.x + ps.x) / 2; const my = (pb.y + ps.y) / 2;
      r.bar(mx - 30, my - 16, 60, 10, e.crossMs / CONFIG.AUCTION.matchMs, COL.good);
    }
    // recent trade flashes
    e.trades.slice(-3).forEach((tr) => {
      const age = e.t - tr.t; if (age > 1500) return;
      r.text(`✔ ${tr.price} cr`, AUC.storeX + AUC.storeW + 10, py(tr.price) - age / 40, { size: 18, color: COL.good });
    });
    // slider (touch friendly) + lane pointer control for the human: prices only move in the trade stage
    const hen = e.entry('p0'); const sy = py(hen.price); const trading = live && !declaring;
    r.ctx.fillStyle = 'rgba(20,28,48,0.9)'; r.ctx.fillRect(AUC.sliderX + 14, AUC.top, 8, AUC.bottom - AUC.top);
    r.ctx.fillStyle = hen.role === ROLE.OUT ? COL.dim : COL.cyan; r.ctx.fillRect(AUC.sliderX + 6, sy - 10, 24, 20);
    r.text(String(hen.price), AUC.sliderX + 18, AUC.top - 26, { size: 20, color: COL.cyan, align: 'center' });
    r.region('a-slider', AUC.sliderX - 6, AUC.top - 10, 48, AUC.bottom - AUC.top + 20, { label: 'Preu', onDown: (x, y) => { if (trading) e.setPrice('p0', this.yPrice(v, y)); }, onMove: (x, y, down) => { if (trading && down) e.setPrice('p0', this.yPrice(v, y)); } });
    r.region('a-lane', this.laneX(0), AUC.top - 24, AUC.laneW, AUC.bottom - AUC.top + 48, {
      label: 'El teu carril',
      onDown: (x, y) => {
        if (!live) return;
        if (declaring) game.auctionRole(x < this.laneX(0) + AUC.laneW / 2 ? ROLE.BUYER : ROLE.SELLER);
        else e.setPrice('p0', this.yPrice(v, y));
      },
      onMove: (x, y, down) => { if (trading && down) e.setPrice('p0', this.yPrice(v, y)); },
      onWheel: (dy) => { if (trading) e.nudge('p0', dy < 0 ? 1 : -1, 1000, 3); }
    });
    // stats
    const X = AUC.statsX;
    r.panel(X, 100, 280, 462, {});
    r.text('El teu estat', X + 12, 108, { size: 18, color: COL.cyan });
    r.text(`${m.label}: ${human.inventory[m.id]} u`, X + 12, 134, { size: 18 }); r.text(`Efectiu: ${human.cash} cr`, X + 12, 158, { size: 18, color: COL.amber });
    r.text('Operacions', X + 12, 194, { size: 18, color: COL.cyan });
    const res = e.result;
    r.text(`Volum ${res.volume}`, X + 12, 220, { size: 16 });
    r.text(res.volume ? `mín ${res.min} · mitjà ${res.avg} · màx ${res.max}` : 'sense operacions encara', X + 12, 244, { size: 16, maxW: 256 });
    this.drawChart(r, e, v, X + 12, 282, 256, 150);
    e.trades.slice(-4).reverse().forEach((tr, i) => r.text(`${Math.floor(tr.t / 1000)}s ${playerById(s, tr.buyer) ? playerById(s, tr.buyer).name : 'Botiga'} ← ${playerById(s, tr.seller) ? playerById(s, tr.seller).name : 'Botiga'} ${tr.price}`, X + 12, 442 + i * 26, { size: 16, maxW: 260 }));
    // human controls: roles only during the declaration, prices only afterwards
    const Y = 610;
    r.panel(16, Y - 8, 1248, 104, {});
    r.button('a-buy', '◀ COMPRADOR (↓)', 30, Y, 230, 48, { checked: hen.role === ROLE.BUYER, disabled: !live || !declaring, onClick: () => game.auctionRole(ROLE.BUYER) });
    r.button('a-sell', 'VENEDOR (↑) ▶', 270, Y, 230, 48, { checked: hen.role === ROLE.SELLER, disabled: !live || !declaring, onClick: () => game.auctionRole(ROLE.SELLER) });

/* =====================================================================
 * 6. InputManager, AudioManager, Renderer, Game and bootstrap
 * ===================================================================== */
/** Mouse, touch (Pointer Events) and keyboard. Keyboard handlers live in independent contexts (a stack). */
class InputManager {
  constructor(canvas, game) {
    this.canvas = canvas; this.game = game;
    this.pointer = { x: -1, y: -1, down: false };
    this.keys = new Set(); this.contexts = []; this.captured = null;
    canvas.addEventListener('pointerdown', (e) => this.onDown(e));
    canvas.addEventListener('pointermove', (e) => this.onMove(e));
    canvas.addEventListener('pointerup', (e) => this.onUp(e));
    canvas.addEventListener('pointercancel', () => {
      const w = this.captured; this.pointer.down = false; this.captured = null;
      if (w && w.onUp) w.onUp(this.pointer.x, this.pointer.y); // a held touch control must never stay stuck
    });
    canvas.addEventListener('wheel', (e) => this.onWheel(e), { passive: false });
    window.addEventListener('keydown', (e) => this.onKeyDown(e));
    window.addEventListener('keyup', (e) => this.keys.delete(e.key));
    window.addEventListener('blur', () => this.keys.clear());
  }
  pushContext(ctx) { this.contexts.push(ctx); return ctx; }
  popContext(ctx) { const i = this.contexts.indexOf(ctx); if (i >= 0) this.contexts.splice(i, 1); }
  toLogical(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * CONFIG.W / r.width, y: (e.clientY - r.top) * CONFIG.H / r.height };
  }
  hit(x, y) {
    const ws = this.game.renderer.widgets;
    for (let i = ws.length - 1; i >= 0; i--) {
      const w = ws[i];
      if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h && !w.disabled) return w;
    }
    return null;
  }
  onDown(e) {
    const p = this.toLogical(e); Object.assign(this.pointer, p, { down: true });
    this.game.audio.unlock();
    try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const w = this.hit(p.x, p.y); this.captured = w;
    if (w) {
      if (w.focusable) { this.game.renderer.focusId = w.id; this.game.renderer.showFocus = false; }
      if (w.onDown) w.onDown(p.x, p.y);
    }
    e.preventDefault();
  }
  onMove(e) {
    const p = this.toLogical(e); Object.assign(this.pointer, p);
    const w = this.captured || this.hit(p.x, p.y);
    if (w && w.onMove) w.onMove(p.x, p.y, this.pointer.down);
  }
  onUp(e) {
    const p = this.toLogical(e); Object.assign(this.pointer, p, { down: false });
    const w = this.captured; this.captured = null;
    const under = this.hit(p.x, p.y);
    if (w && w.onUp) w.onUp(p.x, p.y);
    // Widgets are rebuilt every frame, so `w` (captured on pointerdown) and `under` are never the same object once a
    // frame has passed. Match by stable id and fire the current frame's widget so its closures are fresh.
    const sameWidget = w && under && (under === w || (w.id !== undefined && under.id === w.id));
    if (sameWidget && under.onClick) { this.game.audio.play('click'); under.onClick(p.x, p.y); }
  }
  onWheel(e) {
    const p = this.toLogical(e); const w = this.hit(p.x, p.y);
    if (w && w.onWheel) { w.onWheel(e.deltaY); e.preventDefault(); }
  }
  onKeyDown(e) {
    const g = this.game;
    if (document.activeElement && document.activeElement.id === 'hid') return; // typing into the hidden text input
    this.keys.add(e.key);
    g.audio.unlock();
    if (e.key === 'Escape') { g.onEscape(); e.preventDefault(); return; }
    for (let i = this.contexts.length - 1; i >= 0; i--) {
      const c = this.contexts[i];
      if (c.onKeyDown && c.onKeyDown(e)) { e.preventDefault(); return; }
    }
    const r = g.renderer;
    if (e.key === 'Tab') { r.cycleFocus(e.shiftKey ? -1 : 1); r.showFocus = true; e.preventDefault(); return; }
    const w = r.widgets.find((x) => x.id === r.focusId && !x.disabled);
    if (w) {
      r.showFocus = true;
      if (w.onKey && w.onKey(e)) { e.preventDefault(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && w.onClick) { g.audio.play('click'); w.onClick(w.x + w.w / 2, w.y + w.h / 2); e.preventDefault(); return; }
    }
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  }
}

/** Tiny WebAudio synth: no audio files, off until the first user gesture unlocks the context. */
class AudioManager {
  constructor(game) { this.game = game; this.ctx = null; }
  unlock() {
    if (this.ctx || !window.AudioContext) return;
    try { this.ctx = new AudioContext(); } catch (e) { this.ctx = null; }
  }
  tone(freq, dur, type = 'square', vol = 0.05, slide = 0) {
    if (!this.ctx || !this.game.settings.sound) return;
    const t = this.ctx.currentTime; const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
  }
  play(kind) {
    try {
      if (kind === 'click') this.tone(520, 0.05);
      else if (kind === 'trade') this.tone(700, 0.14, 'triangle', 0.07, 500);
      else if (kind === 'event') this.tone(300, 0.25, 'sawtooth', 0.05, -80);
      else if (kind === 'error') this.tone(150, 0.16, 'square', 0.06);
      else if (kind === 'phase') this.tone(440, 0.09, 'sine', 0.05, 120);
    } catch (e) { /* audio is optional */ }
  }
}

/** Canvas drawing helpers + immediate-mode widgets (rebuilt every frame, consumed by InputManager). */
class Renderer {
  constructor(canvas, game) {
    this.canvas = canvas; this.game = game; this.ctx = canvas.getContext('2d');
    this.widgets = []; this.focusId = null; this.showFocus = false; this.modalIndex = 0;
    this.font = 'ui-monospace, Menlo, Consolas, "Courier New", monospace';
  }
  begin() {
    const c = this.ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.imageSmoothingEnabled = false;
    c.setLineDash([]); c.fillStyle = COL.bg; c.fillRect(0, 0, CONFIG.W, CONFIG.H);
    this.widgets = []; this.modalIndex = 0;
  }
  focusables() { return this.widgets.filter((w, i) => w.focusable && !w.disabled && i >= this.modalIndex); }
  cycleFocus(dir) {
    const f = this.focusables(); if (!f.length) return;
    const i = f.findIndex((w) => w.id === this.focusId);
    this.focusId = f[(i + dir + f.length * 2) % f.length].id;
  }
  beginModal() { this.modalIndex = this.widgets.length; }
  asset(name, x, y, w, h, frame = 0) { return this.game.assets.draw(this.ctx, name, x, y, w, h, frame); }
  assetContain(name, x, y, w, h, frame = 0) { return this.game.assets.drawContain(this.ctx, name, x, y, w, h, frame); }
  assetFrame(name, x, y, w, h, frame) { return this.game.assets.drawContain(this.ctx, name, x, y, w, h, frame); }
  icon(resId, x, y, size) { const d = RESOURCE_DEFS[resId]; if (d) this.asset(d.icon, x, y, size, size); }
  dim(a) { this.ctx.fillStyle = `rgba(4,6,14,${a})`; this.ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); }
  font_(size, bold = true) { return `${bold ? 'bold ' : ''}${size}px ${this.font}`; }
  measure(str, size) { this.ctx.font = this.font_(size); return this.ctx.measureText(str).width; }
  text(str, x, y, o = {}) {
    const c = this.ctx; const size = o.size || 16; let s = String(str);
    c.font = this.font_(size, o.bold !== false); c.textAlign = o.align || 'left'; c.textBaseline = 'top';
    if (o.maxW && c.measureText(s).width > o.maxW) {
      while (s.length > 1 && c.measureText(`${s}…`).width > o.maxW) s = s.slice(0, -1);
      s += '…';
    }
    if (o.shadow !== false) { c.fillStyle = 'rgba(0,0,0,0.75)'; c.fillText(s, x + 1, y + 1); }
    c.fillStyle = o.color || COL.text; c.fillText(s, x, y);
  }
  /** Word-wraps inside maxW and returns the height used. */
  wrap(str, x, y, maxW, lineH, o = {}) {
    const c = this.ctx; c.font = this.font_(o.size || 16, o.bold !== false);
    const words = String(str).split(' '); const lines = []; let cur = '';
    words.forEach((w) => { const t = cur ? `${cur} ${w}` : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur);
    lines.forEach((l, i) => this.text(l, o.align === 'center' ? x + maxW / 2 : x, y + i * lineH, o));
    return lines.length * lineH;
  }
  bar(x, y, w, h, frac, color) {
    const c = this.ctx; c.fillStyle = 'rgba(20,28,48,0.9)'; c.fillRect(x, y, w, h);
    c.fillStyle = color; c.fillRect(x, y, Math.round(w * clamp(frac, 0, 1)), h);
    c.strokeStyle = COL.border; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  /** Player identity glyph: shape + colour, so ownership never depends on colour alone. */
  glyph(shape, x, y, rad, color, stroke) {
    const c = this.ctx; c.beginPath();
    if (shape === 'circle') c.arc(x, y, rad, 0, Math.PI * 2);
    else if (shape === 'square') c.rect(x - rad, y - rad, rad * 2, rad * 2);
    else if (shape === 'triangle') { c.moveTo(x, y - rad); c.lineTo(x + rad, y + rad); c.lineTo(x - rad, y + rad); c.closePath(); }
    else { c.moveTo(x, y - rad * 1.2); c.lineTo(x + rad * 1.2, y); c.lineTo(x, y + rad * 1.2); c.lineTo(x - rad * 1.2, y); c.closePath(); }
    c.fillStyle = color; c.fill();
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 2; c.stroke(); }
  }
  panel(x, y, w, h, o = {}) {
    const c = this.ctx;
    c.fillStyle = o.fill || COL.panel; c.fillRect(x, y, w, h);
    if (o.frame === false) return;
    c.strokeStyle = o.border || COL.border; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
    this.nineSlice(x, y, w, h, 10);
  }
  /** Border-only 9-slice (the centre is skipped on purpose: it is meant to be transparent and the panel already has a fill). */
  nineSlice(x, y, w, h, k) {
    const a = this.game.assets; const img = a.scaled('ui_frame_9slice', k * 3, k * 3);
    if (!img || w < k * 2 || h < k * 2) return;
    const c = this.ctx;
    c.drawImage(img, 0, 0, k, k, x, y, k, k); c.drawImage(img, 2 * k, 0, k, k, x + w - k, y, k, k);
    c.drawImage(img, 0, 2 * k, k, k, x, y + h - k, k, k); c.drawImage(img, 2 * k, 2 * k, k, k, x + w - k, y + h - k, k, k);
    c.drawImage(img, k, 0, k, k, x + k, y, w - 2 * k, k); c.drawImage(img, k, 2 * k, k, k, x + k, y + h - k, w - 2 * k, k);
    c.drawImage(img, 0, k, k, k, x, y + k, k, h - 2 * k); c.drawImage(img, 2 * k, k, k, k, x + w - k, y + k, k, h - 2 * k);
  }
  focusRing(id, x, y, w, h) {
    if (this.focusId !== id || !this.showFocus) return;
    const c = this.ctx; c.strokeStyle = '#ffffff'; c.lineWidth = 4; c.strokeRect(x - 3, y - 3, w + 6, h + 6);
    c.strokeStyle = '#000'; c.lineWidth = 2; c.strokeRect(x - 5, y - 5, w + 10, h + 10);
  }
  button(id, label, x, y, w, h, o = {}) {
    const c = this.ctx; const p = this.game.input.pointer;
    const hover = !o.disabled && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
    c.fillStyle = o.disabled ? COL.btnOff : o.primary ? '#1d6e85' : o.checked ? '#27553a' : hover ? COL.btnHi : COL.btn;
    c.fillRect(x, y, w, h);
    c.strokeStyle = o.disabled ? '#2a3348' : o.checked ? COL.good : o.primary ? COL.cyan : COL.border; c.lineWidth = o.checked ? 3 : 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
    this.text(`${o.checked ? '✓ ' : ''}${label}`, x + w / 2, y + (h - (o.size || 18)) / 2 - 1, { size: o.size || 18, align: 'center', color: o.disabled ? COL.textOff : COL.text, maxW: w - 10, shadow: false });
    this.widgets.push({ id, x, y, w, h, label, disabled: !!o.disabled, focusable: !o.disabled, onClick: o.onClick, onDown: o.onDown });
    this.focusRing(id, x, y, w, h);
  }
  region(id, x, y, w, h, o = {}) {
    this.widgets.push({ id, x, y, w, h, label: o.label, focusable: !!o.focusable, onClick: o.onClick, onDown: o.onDown, onMove: o.onMove, onUp: o.onUp, onWheel: o.onWheel, onKey: o.onKey });
    if (o.focusable) this.focusRing(id, x, y, w, h);
  }
  textField(id, value, x, y, w, h, o) {
    const c = this.ctx; const focused = this.focusId === id;
    c.fillStyle = '#0b1120'; c.fillRect(x, y, w, h);
    c.strokeStyle = focused ? COL.cyan : COL.border; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
    const caret = focused && Math.floor(this.game.now / 500) % 2 === 0 ? '|' : '';
    this.text(`${value}${caret}`, x + 10, y + (h - 20) / 2 - 1, { size: 20, maxW: w - 20, shadow: false });
    this.widgets.push({
      id, x, y, w, h, label: 'Camp de text', focusable: true,
      onClick: () => this.game.beginTextEdit(o.onChange, value, o.maxLen),
      // Read the live value (o.get): several keys can arrive inside one frame, so the drawn `value` may already be stale.
      onKey: (e) => {
        const cur = o.get ? o.get() : value;
        if (e.key === 'Backspace') { o.onChange(cur.slice(0, -1)); return true; }
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && cur.length < o.maxLen) { o.onChange(cur + e.key); return true; }
        return false;
      }
    });
    this.focusRing(id, x, y, w, h);
  }
}

class Game {
  constructor(canvas, assets) {
    this.canvas = canvas; this.assets = assets;
    this.now = 0; this.paused = false; this.helpOpen = false; this.mode = 'loading';
    this.debug = false; this.autopilot = false; this.debugForced = []; this.debugLog = ''; this.fps = 60; this.titleNotice = '';
    this.persist = true; // false in self-tests: a simulated game must never overwrite the player's save
    this.state = null; this.rng = null; this.rt = {}; this.turns = new TurnSystem();
    this.settings = this.loadSettings();
    this.setup = { name: 'Roger', color: 'yellow', difficulty: 'colony', seed: this.randomSeed() };
    this.renderer = new Renderer(canvas, this); this.input = new InputManager(canvas, this); this.audio = new AudioManager(this);
    const map = new MapScreen();
    this.screens = { title: new TitleScreen(), setup: new SetupScreen(), map, production: new ProductionScreen(map), report: new ReportScreen(), auction: new AuctionScreen(), gameover: new GameOverScreen() };
    this.screen = this.screens.title; this.screenCtx = null;
    this.help = new HelpOverlay(); this.pauseOv = new PauseOverlay();
    this.defineTurnPhases();
    this.makeHiddenInput();
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.mode === 'play') this.paused = true; });
  }

  /* ---- settings, helpers ---- */
  loadSettings() {
    const d = { sound: true, reduceMotion: false };
    try { return Object.assign(d, JSON.parse(localStorage.getItem('ruc-settings') || '{}')); } catch (e) { return d; }
  }
  saveSettings() { try { localStorage.setItem('ruc-settings', JSON.stringify(this.settings)); } catch (e) { /* ignore */ } }
  /** Seeds are only generated here, outside game logic, so Math.random never touches a deterministic run. */
  randomSeed() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
  announce(text) { const el = document.getElementById('sr'); if (el) el.textContent = text; }
  fast(ms) { return this.autopilot ? Math.min(ms, 120) : ms; }
  toggleSound() { this.settings.sound = !this.settings.sound; this.saveSettings(); }
  toggleReduceMotion() { this.settings.reduceMotion = !this.settings.reduceMotion; this.saveSettings(); }
  toggleHelp() { this.helpOpen = !this.helpOpen; }
  togglePause() { if (this.mode === 'play') this.paused = !this.paused; }
  onEscape() {
    if (this.helpOpen) this.helpOpen = false;
    else if (this.mode === 'play') this.paused = !this.paused;
    else if (this.mode === 'setup') this.goTitle();
  }
  makeHiddenInput() {
    const el = document.createElement('input');
    el.id = 'hid'; el.setAttribute('aria-hidden', 'true'); el.autocomplete = 'off'; el.spellcheck = false;
    el.style.cssText = 'position:fixed;left:50%;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;';
    document.body.appendChild(el);
    el.addEventListener('input', () => { if (this.textEdit) this.textEdit.onChange(el.value.slice(0, this.textEdit.maxLen)); });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); el.blur(); this.canvas.focus(); }
      else if (e.key === 'Tab') { e.preventDefault(); el.blur(); this.canvas.focus(); this.renderer.cycleFocus(e.shiftKey ? -1 : 1); this.renderer.showFocus = true; }
    });
    el.addEventListener('blur', () => { this.textEdit = null; });
    this.hid = el;
  }
  /** Tapping a text field focuses a real (invisible) input so touch keyboards appear. */
  beginTextEdit(onChange, value, maxLen) { this.textEdit = { onChange, maxLen }; this.hid.value = value; this.hid.focus(); }

  /* ---- screens and modes ---- */
  setScreen(name) {
    if (this.screenCtx) { this.input.popContext(this.screenCtx); this.screenCtx = null; }
    this.screen = this.screens[name];
    if (this.screen.onKey) this.screenCtx = this.input.pushContext({ onKeyDown: (e) => this.screen.onKey(this, e) });
  }
  goTitle() { this.mode = 'title'; this.paused = false; this.helpOpen = false; this.setScreen('title'); }
  goSetup() { this.mode = 'setup'; this.setScreen('setup'); }
  /**
   * Autosaves happen at every phase boundary and between colonists in development. A manual exit also writes a save when the
   * current phase can be resumed exactly (`resumable`: land race, development, auctions); the other phases keep the last boundary
   * save, because re-entering them half-way could apply their effects twice.
   */
  exitToTitle() {
    const def = this.turns.phase && this.turns.get(this.turns.phase);
    if (def && def.resumable) this.save();
    this.turns.phase = null; this.goTitle();
  }
  newGame(opts) {
    const seed = (opts.seed && String(opts.seed).trim()) || this.randomSeed();
    const { state, rng } = GameState.create({ seed, difficulty: opts.difficulty, playerName: (opts.playerName || 'Roger').trim() || 'Roger', colorId: opts.colorId });
    this.state = state; this.rng = rng; this.rt = {}; this.paused = false; this.helpOpen = false; this.mode = 'play';
    state.createdAt = Date.now();
    this.turns.enter(this, 'TURN_START');
  }
  continueGame() {
    const r = SaveSystem.load();
    if (!r || r.incompatible) {
      // Never accepted silently: the player is told why, and the old save is discarded.
      this.titleNotice = r && r.reason === 'old_rules'
        ? `El desat és d'una versió anterior (esquema ${r.version}) amb unes altres regles: no es pot continuar. Comença una partida nova.`
        : 'El desat és incompatible o està malmès. Comença una partida nova.';
      SaveSystem.clear(); this.goTitle(); return;
    }
    this.resume(r);
  }
  /** Re-enters the saved phase; resumable phases continue from their saved phaseData instead of starting again. */
  resume(r) {
    this.state = r.state; this.rng = new SeededRNG(r.state.seed); this.rng.setState(r.state.rngState);
    this.rt = {}; this.paused = false; this.mode = 'play';
    if (this.state.phase === 'GAME_OVER') { this.turns.phase = null; this.setScreen('gameover'); return; }
    const def = this.turns.get(this.state.phase);
    const resume = !!(def && def.resumable && this.state.phaseData && Object.keys(this.state.phaseData).length);
    this.turns.enter(this, this.state.phase, resume);
  }
  /** A resumable phase copies its live objects (e.g. the auction engine) into phaseData as plain data before a save. */
  snapshotPhase() {
    const def = this.turns.phase && this.turns.get(this.turns.phase);
    if (def && def.snapshot && this.state.phaseData === this.turns.phaseData) def.snapshot(this, this.turns);
  }
  save() {
    if (!this.state || this.mode !== 'play' || !this.persist) return;
    this.snapshotPhase();
    SaveSystem.save(this.state, this.rng);
  }
  /** [manual] the colony must reach 60,000; only then is the leader the First Founder. The ranking is shown either way. */
  finish() {
    const s = this.state; const surv = ScoringSystem.survival(s); const rank = ScoringSystem.ranking(s, this.rng);
    s.final = { survives: surv.survives, combined: surv.combined, winnerId: surv.survives ? rank[0].p.id : null, rank: rank.map((x) => ({ id: x.p.id, b: x.b })) };
    s.phase = 'GAME_OVER'; this.turns.phase = null; this.setScreen('gameover'); this.save();
  }

  /* ---- loop ---- */
  start() {
    this.lastTs = null;
    const loop = (ts) => {
      if (this.lastTs === null) this.lastTs = ts;
      const raw = ts - this.lastTs; this.lastTs = ts;
      if (raw > 0) this.fps = Math.round(this.fps * 0.9 + (1000 / raw) * 0.1);
      this.tick(raw); this.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  /** Logic step. `dt` is capped so a slow frame or a tab switch never advances the game in one huge jump. */
  tick(rawDt) {
    const dt = Math.min(Math.max(rawDt, 0), CONFIG.MAX_DT_MS);
    if (this.paused || this.helpOpen) return;
    this.now += dt;
    if (this.mode === 'play' && this.turns.phase) this.turns.update(this, dt);
  }
  /** Test/debug helper: runs `ms` of game time in fixed steps (optionally until `until()` is true). */
  fastForward(ms, step = 50, until = null) {
    for (let t = 0; t < ms; t += step) { this.tick(step); if (until && until()) return true; }
    return until ? until() : true;
  }
  render() {
    const r = this.renderer; r.begin();
    if (this.mode === 'loading') this.drawLoading(r);
    else if (this.mode === 'test') this.drawTests(r);
    else {
      this.screen.draw(this, r);
      if (this.mode === 'title' && this.titleNotice) r.text(this.titleNotice, 64, 620, { size: 18, color: COL.bad, maxW: 1100 });
      if (this.helpOpen) { r.beginModal(); r.region('barrier', 0, 0, CONFIG.W, CONFIG.H, {}); this.help.draw(this, r); }
      else if (this.paused) { r.beginModal(); r.region('barrier', 0, 0, CONFIG.W, CONFIG.H, {}); this.pauseOv.draw(this, r); }
    }
  }
  drawLoading(r) {
    r.text('R.U.C.', 640, 200, { size: 72, color: COL.amber, align: 'center' });
    r.bar(390, 340, 500, 24, this.assets.progress, COL.cyan);
    r.text(`Carregant recursos ${Math.round(this.assets.progress * 100)}% (${this.assets.settled}/${this.assets.list.length})`, 640, 380, { size: 18, align: 'center' });
  }
  drawTests(r) {
    const res = this.testResults; const rows = 25; const cols = Math.max(1, Math.ceil(res.results.length / rows)); const cw = Math.floor(1260 / cols);
    r.text(`Self-tests: ${res.passed}/${res.total} PASS${res.failed ? ` · ${res.failed} FAIL` : ''} (detall complet a la consola)`, 16, 10, { size: 22, color: res.failed ? COL.bad : COL.good });
    res.results.forEach((t, i) => {
      const col = Math.floor(i / rows); const y = 44 + (i % rows) * 27;
      r.text(`${t.ok ? 'PASS' : 'FAIL'} ${t.name}`, 12 + col * cw, y, { size: 16, color: t.ok ? COL.good : COL.bad, maxW: cw - 16 });
      if (!t.ok) r.text(t.detail, 36 + col * cw, y + 13, { size: 16, color: COL.amber, maxW: cw - 40 });
    });
  }

  /* ---- what the HUD/instruction line shows ---- */
  /** { left, total } for the HUD's shrinking time bar, or null when nothing is timed right now. */
  hudTimer() {
    const ph = this.turns.phase;
    if (ph === 'DEVELOPMENT') { const w = this.humanWalk(); return w ? { left: w.timeLeft, total: w.timeTotal } : null; }
    if (ph && ph.startsWith('AUCTION_') && this.rt.auction) {
      const e = this.rt.auction.engine;
      return e.canDeclare() ? { left: e.declareLeft, total: CONFIG.AUCTION.declareMs } : { left: Math.max(0, CONFIG.AUCTION.maxMs - e.t), total: CONFIG.AUCTION.maxMs };
    }
    return null;
  }
  /** The live land-race object while the LAND_GRANT phase runs (null otherwise). */
  landRace() { return this.turns.phase === 'LAND_GRANT' && this.turns.phaseData ? this.turns.phaseData.land || null : null; }
  /** The colonist whose development turn is running (null outside DEVELOPMENT). */
  devSlot() { const d = this.turns.phase === 'DEVELOPMENT' && this.turns.phaseData ? this.turns.phaseData.dev : null; return d ? d.slot : null; }
  /** The human's walker while it is really walking (null during the event card, the AI turns and after the end). */
  humanWalk() { const s = this.devSlot(); return s && s.stage === 'walk' && s.walk && !s.walk.ended ? s.walk : null; }
  instruction() {
    const ph = this.turns.phase;
    if (ph === 'LAND_GRANT') {
      const land = this.landRace(); if (!land) return '';
      const mine = land.claimed.p0;
      if (mine !== undefined) return `Has reclamat la parcel·la #${mine + 1}. Esperant els altres...`;
      if (land.done) return 'Aquest torn no tens parcel·la.';
      if (land.pause > 0 && land.lastClaim) return `${playerById(this.state, land.lastClaim.pid).name} ha reclamat la parcel·la #${land.lastClaim.plot + 1}`;
      return 'Clica o prem Enter per reclamar aquesta parcel·la';
    }
    if (ph === 'DEVELOPMENT') {
      const slot = this.devSlot(); if (!slot) return '';
      const w = this.humanWalk();
      if (w) {
        if (!w.carrying) return w.area === 'town' ? 'Entra al corral per comprar un RUC, o surt a retirar-ne un d\'instal·lat.' : 'Torna al poble per un RUC, o retira\'n un de la casa d\'una parcel·la teva.';
        if (!w.carrying.module) return w.area === 'town' ? 'Entra a un taller per equipar el RUC.' : 'Torna al poble: el RUC s\'ha d\'equipar a un taller.';
        return w.area === 'town' ? 'Surt del poble i porta el RUC a la casa d\'una parcel·la teva.' : 'Posa\'t sobre la casa d\'una parcel·la teva i prem Acció.';
      }
      if (slot.stage === 'countdown') return 'Prepara\'t: el teu torn comença de seguida.';
      return slot.stage === 'card' ? 'Esdeveniment individual' : `Desenvolupament: torn de ${playerById(this.state, slot.pid).name}`;
    }
    if (ph === 'PLANET_EVENT') return 'Esdeveniment planetari abans de la producció';
    return ph ? this.turns.get(ph).label : '';
  }

  /* ---- human actions ---- */
  /** The human "buzzer" of the land race: stamped on the GAME clock, so it is deterministic and frozen by pause. */
  humanClaim() {
    const land = this.landRace();
    if (!land || this.paused || this.helpOpen) return;
    if (LandRace.press(land, 'p0')) this.audio.play('click');
  }
  /** Walking direction: held arrow keys plus the on-screen pad (touch / pointer). */
  devDirs() { return walkDirs(this.input.keys, this.rt.pad); }
  /** The colonist's action button. There is deliberately no way to pick a plot, buy or outfit from a panel. */
  devAction() { const w = this.humanWalk(); if (w && !this.paused && !this.helpOpen) DevWalk.act(this.state, w); }
  devFinish() { const w = this.humanWalk(); if (w && !this.paused) DevWalk.end(this.state, w, 'done'); }
  devSkipCard() { const s = this.devSlot(); if (s && s.stage === 'card') s.timer = 0; }
  devFeedback(w) {
    const kind = w.log[w.log.length - 1];
    this.audio.play(w.bad ? 'error' : kind === 'install' ? 'phase' : 'click');
    if (w.msg) this.announce(w.msg);
  }
  /** Starts the colonist whose turn it is: [manual] its own 25% individual event draw, then the walk (human) or the AI's moves. */
  startDevSlot() {
    const dev = this.turns.phaseData.dev; const s = this.state;
    if (dev.idx >= dev.order.length) { this.turns.canAdvance = true; return; }
    const pid = dev.order[dev.idx]; const p = playerById(s, pid);
    const fi = this.debugForced.findIndex((id) => EVENT_DEFS[id] && EVENT_DEFS[id].scope === 'individual');
    const forced = p.isHuman && fi >= 0 ? this.debugForced.splice(fi, 1)[0] : null;
    const ev = EventSystem.rollIndividual(s, this.rng, pid, forced);
    if (ev) { s.event.items.push(ev); this.audio.play('event'); }
    const slot = { pid, event: ev, stage: 'show', timer: 0, log: [], walk: null };
    if (p.isHuman && !this.autopilot) {
      // The walk itself (and its clock) is only created once the "get ready" countdown ends — see updateDevelopment.
      slot.stage = ev ? 'card' : 'countdown'; slot.timer = ev ? 6000 : CONFIG.DEV.countdownMs;
      this.announce(ev ? ev.text : `Prepara't: el teu torn de desenvolupament comença en ${Math.ceil(CONFIG.DEV.countdownMs / 1000)} s.`);
    } else {
      if (ev) slot.log.push(ev.text);
      const acts = AISystem.develop(s, this.rng, p);
      acts.forEach((a) => slot.log.push(`${p.name}: RUC de ${resLabel(a.module).toLowerCase()} a la parcel·la ${a.plotId + 1}`));
      if (!acts.length) slot.log.push(`${p.name} no instal·la cap RUC aquest torn.`);
      slot.timer = this.fast(ev ? 2600 : 1400);
      this.announce(slot.log.join(' '));
    }
    dev.slot = slot;
  }
  updateDevelopment(dt) {
    const dev = this.turns.phaseData.dev; const slot = dev.slot;
    if (!slot) { this.startDevSlot(); return; }
    if (slot.stage === 'card') { slot.timer -= dt; if (slot.timer <= 0) { slot.stage = 'countdown'; slot.timer = CONFIG.DEV.countdownMs; } return; }
    if (slot.stage === 'countdown') {
      slot.timer -= dt;
      if (slot.timer <= 0) { slot.stage = 'walk'; slot.walk = DevWalk.create(this.state, slot.pid, ConsumptionSystem.humanTimeMs(this.state, playerById(this.state, slot.pid))); }
      return;
    }
    if (slot.stage === 'walk') {
      const w = slot.walk;
      DevWalk.update(this.state, w, this.devDirs(), dt);
      if (w.seq !== this.rt.walkSeq) { this.rt.walkSeq = w.seq; this.devFeedback(w); }
      if (w.ended) { slot.stage = 'show'; slot.timer = 1500; slot.log = [w.ended === 'timeout' ? 'S\'ha acabat el temps de desenvolupament.' : 'Has acabat el torn.', w.msg].filter(Boolean); }
      return;
    }
    slot.timer -= dt;
    if (slot.timer > 0) return;
    dev.idx += 1; dev.slot = null; this.rt.walkSeq = null; this.rt.pad = { x: 0, y: 0 };
    if (dev.idx >= dev.order.length) { this.turns.canAdvance = true; return; }
    // Boundary save between colonists: a reload starts the next colonist's turn (and its event draw) exactly once.
    this.save();
    this.startDevSlot();
  }
  skipPhase() { if (this.turns.phaseData && this.turns.phaseData.skippable) this.turns.canAdvance = true; }

  /* ---- auction input ---- */
  /** Roles can only be chosen during the declaration ([manual]); afterwards they are fixed. */
  auctionRole(role) {
    const a = this.rt.auction; if (!a || a.engine.ended || !a.engine.canDeclare()) return;
    if (role !== ROLE.OUT) a.lastRole = role;
    a.engine.setRole('p0', role);
  }
  auctionToggleOut() {
    const a = this.rt.auction; if (!a) return;
    this.auctionRole(a.engine.entry('p0').role === ROLE.OUT ? (a.lastRole || ROLE.BUYER) : ROLE.OUT);
  }
  updateAuctionInput(dt) {
    const a = this.rt.auction; const e = a.engine; const k = this.input.keys;
    if (e.stage !== 'trade' || e.entry('p0').role === ROLE.OUT) return;
    const speed = CONFIG.AUCTION.humanStepsPerSec * (k.has('Shift') ? 3 : 1);
    if (k.has('ArrowUp')) e.nudge('p0', 1, dt, speed);
    if (k.has('ArrowDown')) e.nudge('p0', -1, dt, speed);
  }
  /** Visible price window: from the store minimum up to a top that only grows during the auction (never past the colonist limit). */
  auctionView() {
    const a = this.rt.auction; const e = a.engine; const m = e.market;
    const prices = e.entries.filter((x) => x.role !== ROLE.OUT).map((x) => x.price).concat([e.centralPrice()]);
    const want = Math.ceil((Math.max(...prices) * 1.3 + 10) / 20) * 20;
    a.viewHi = Math.min(Math.max(a.viewHi || 0, want, m.minPrice + 60), e.playerMax());
    return { lo: m.minPrice, hi: Math.max(a.viewHi, m.minPrice + 20) };
  }

  /* ---- debug ---- */
  debugNextPhase() {
    const a = this.rt.auction;
    if (a && this.turns.phase && this.turns.phase.startsWith('AUCTION_') && !a.engine.ended) a.engine._end('debug');
    else if (this.turns.phase === 'DEVELOPMENT' && this.humanWalk()) this.devFinish();
    else this.turns.canAdvance = true;
  }
  debugCash() { ResourceLedger.moveCash(this.state, 'nature', 'p0', 1000); }
  /** Applies ONE event right now (individual ones target the human); nothing else changes. */
  debugEvent() {
    const ids = Object.keys(EVENT_DEFS); this.debugEventIdx = ((this.debugEventIdx || 0) + 1) % ids.length;
    const id = ids[this.debugEventIdx]; const def = EVENT_DEFS[id];
    try {
      if (!EventSystem.applicable(this.state, id, 'p0')) { this.debugLog = `${id}: ara no és aplicable`; return; }
      const rec = EventSystem.build(this.state, this.rng, id, def.scope === 'individual' ? 'p0' : null);
      this.state.event = this.state.event || { items: [] }; this.state.event.items.push(rec); this.debugLog = `forçat: ${id}`;
    } catch (e) { this.debugLog = `error ${e.message}`; }
  }
  drawDebugBar(r) {
    const s = this.state; const y = 696;
    r.panel(0, y, CONFIG.W, 24, { fill: 'rgba(60,20,40,0.94)', frame: false });
    const stock = enabledResources().map((d) => `${d.id[0].toUpperCase()}${s.store.stock[d.id]}`).join(' ');
    r.text(`${this.turns.phase} · llavor ${s.seed} · ${this.fps} FPS · botiga ${stock} · RUC ${s.store.ruc} · ${this.debugAI()} ${this.debugLog}`, 8, y + 3, { size: 16, maxW: 780, shadow: false });
    r.button('dbg-next', 'Següent fase', 800, y, 150, 24, { size: 16, onClick: () => this.debugNextPhase() });
    r.button('dbg-cash', '+1000 cr', 958, y, 110, 24, { size: 16, onClick: () => this.debugCash() });
    r.button('dbg-ev', 'Força esdeveniment', 1076, y, 188, 24, { size: 16, onClick: () => this.debugEvent() });
  }
  debugAI() {
    const a = this.rt.auction; if (!a) return '';
    return this.state.players.slice(1).map((p) => { const b = a.brains[p.id]; return b ? `${p.name[0]}:${b.role[0]}${b.target ? Math.round(b.target) : '-'}` : ''; }).join(' ');
  }

  /* ---- turn phases ([manual] cycle: land grant, development, planetary event, production, status, auctions, summary) ---- */
  defineTurnPhases() {
    const timed = (g, dt, ts) => { ts.phaseData.timer -= dt; if (ts.phaseData.timer <= 0) ts.canAdvance = true; };
    const defs = [
      { id: 'TURN_START', label: 'Inici de torn', enter: (g, ts) => { const s = g.state; s.turn += 1; s.modifiers = GameState.freshModifiers(); s.event = { items: [] }; g.rt = {}; g.setScreen('map'); ts.canAdvance = true; } },
      {
        id: 'LAND_GRANT', label: 'Adjudicació de terra', save: true, resumable: true,
        enter: (g, ts) => {
          g.setScreen('map');
          if (ts.phaseData.land) return; // resumed from a save taken mid-sweep: keep cursor, timers and claims as they were
          // The autopilot human is driven by the same AI planner (with its simulated reaction time).
          const aiIds = g.state.players.filter((p) => !p.isHuman || g.autopilot).map((p) => p.id);
          ts.phaseData.land = LandRace.create(g.state, g.rng, aiIds);
        },
        update: (g, dt, ts) => {
          const land = ts.phaseData.land;
          LandRace.update(g.state, g.rng, land, dt);
          const c = land.lastClaim; const key = c ? `${c.pid}@${c.clock}` : '';
          if (c && key !== g.rt.seenClaim) {
            g.rt.seenClaim = key; g.audio.play(c.pid === 'p0' ? 'trade' : 'phase');
            g.announce(`${playerById(g.state, c.pid).name} reclama la parcel·la ${c.plot + 1}`);
          }
          if (land.done) { land.hold -= dt; if (land.hold <= 0) ts.canAdvance = true; }
        }
      },
      {
        // One colonist after another in net-worth order (DevOrder). The whole queue lives in phaseData, so it can be saved mid-way.
        id: 'DEVELOPMENT', label: 'Desenvolupament', save: true, resumable: true,
        enter: (g, ts) => {
          g.setScreen('map'); g.rt.pad = { x: 0, y: 0 };
          if (!ts.phaseData.dev) ts.phaseData.dev = DevOrder.create(g.state);
          if (!ts.phaseData.dev.slot) g.startDevSlot();
        },
        update: (g, dt) => g.updateDevelopment(dt)
      },
      {
        id: 'PLANET_EVENT', label: 'Esdeveniment planetari', save: true,
        enter: (g, ts) => {
          const fi = g.debugForced.findIndex((id) => EVENT_DEFS[id] && EVENT_DEFS[id].scope === 'planet');
          const rec = EventSystem.rollPlanet(g.state, g.rng, fi >= 0 ? g.debugForced.splice(fi, 1)[0] : null);
          ts.phaseData.items = rec ? [rec] : []; if (rec) g.state.event.items.push(rec);
          ts.phaseData.timer = g.fast(rec ? 4000 : 1300); ts.phaseData.skippable = true;
          if (rec) g.audio.play('event');
          g.announce(rec ? rec.text : 'Cap esdeveniment planetari'); g.setScreen('map');
        },
        update: timed
      },
      {
        id: 'PRODUCTION', label: 'Producció', save: true,
        enter: (g, ts) => {
          const st = SettlementSystem.run(g.state, g.rng);
          const order = []; st.rows.forEach((row) => row.items.forEach((it) => order.push({ playerId: row.playerId, ...it })));
          g.rt.prod = { reports: st.rows, order, t: 0, duration: g.fast(g.settings.reduceMotion ? 1800 : 5000) }; ts.phaseData.skippable = true; g.setScreen('production');
          g.announce('Producció completada');
        },
        update: (g, dt, ts) => { const p = g.rt.prod; p.t += dt; if (p.t >= p.duration + g.fast(2500)) ts.canAdvance = true; }
      },
      {
        id: 'STATUS', label: 'Estat: consum i malbaratament', save: true,
        enter: (g, ts) => { g.rt.reportMode = 'status'; ts.phaseData.timer = g.fast(400); ts.phaseData.skippable = true; g.setScreen('report'); g.announce('Estat del torn: consum, malbaratament i collita'); },
        update: (g, dt, ts) => { if (g.autopilot) timed(g, dt, ts); }
      }
    ];
    auctionResources().forEach((d) => defs.push(this.auctionPhase(d)));
    defs.push(
      {
        id: 'TURN_REPORT', label: 'Informe del torn', save: true,
        enter: (g, ts) => {
          const s = g.state;
          g.rt.storeReport = StoreSystem.betweenTurns(s); ScoringSystem.endTurn(s);
          g.rt.turnRank = ScoringSystem.ranking(s, g.rng); g.rt.auctionSummary = s.auctionLog.filter((x) => x.turn === s.turn);
          g.rt.reportMode = 'turn'; ts.phaseData.skippable = true; ts.phaseData.timer = g.fast(400); g.setScreen('report');
          g.announce(`Informe del torn ${s.turn}`);
        },
        update: (g, dt, ts) => { if (g.autopilot) timed(g, dt, ts); }
      },
      { id: 'AUTOSAVE', label: 'Desat', enter: (g, ts) => { g.save(); ts.canAdvance = true; } },
      { id: 'NEXT', label: 'Següent / final', enter: (g, ts) => { if (g.state.turn >= CONFIG.TURNS) g.finish(); else ts.canAdvance = true; } }
    );
    this.turns.define(defs);
  }
  auctionPhase(def) {
    return {
      id: `AUCTION_${def.id}`, label: `Subhasta de ${def.label.toLowerCase()}`, save: true, resumable: true,
      enter: (g, ts) => {
        const s = g.state; const market = AuctionEngine.fungibleMarket(def); const onTrade = () => g.audio.play('trade');
        const saved = ts.phaseData.auction;
        if (saved) {
          // Resumed from a save taken mid-auction (declaration or trade stage): exact engine, AI brains and roles.
          g.rt.auction = { engine: AuctionEngine.restore(saved.engine, { market, state: s, rng: g.rng, onTrade }), brains: JSON.parse(JSON.stringify(saved.brains)), res: def.id, endHold: saved.endHold, lastRole: saved.lastRole, viewHi: saved.viewHi };
        } else {
          const engine = new AuctionEngine({ market, state: s, rng: g.rng, colonists: s.players.map((p) => p.id), onTrade, declareMs: CONFIG.AUCTION.declareMs });
          const brains = {};
          s.players.forEach((p) => { if (!p.isHuman || g.autopilot) brains[p.id] = AISystem.createBrain(s, g.rng, p); });
          // [manual] with a surplus your character jumps to SELL, otherwise to BUY; the human can change it until the declaration ends.
          s.players.forEach((p) => { if (p.isHuman && !g.autopilot) engine.setRole(p.id, AISystem.defaultRole(s, p, def.id)); });
          g.rt.auction = { engine, brains, res: def.id, endHold: 0, lastRole: ROLE.BUYER, viewHi: 0 };
        }
        g.setScreen('auction'); g.announce(`Subhasta de ${def.label}: declara comprador, venedor o fora`);
      },
      snapshot: (g, ts) => {
        const a = g.rt.auction;
        if (a) ts.phaseData.auction = { engine: a.engine.snapshot(), brains: JSON.parse(JSON.stringify(a.brains)), endHold: a.endHold, lastRole: a.lastRole, viewHi: a.viewHi || 0 };
      },
      update: (g, dt, ts) => {
        const a = g.rt.auction; const e = a.engine; const s = g.state;
        if (!e.ended) {
          s.players.forEach((p) => { const b = a.brains[p.id]; if (b) AISystem.tick(s, g.rng, p, b, e, dt); });
          if (!g.autopilot) g.updateAuctionInput(dt);
          e.update(dt);
        } else {
          a.endHold += dt; ts.phaseData.skippable = true;
          if (a.endHold >= (g.autopilot ? 200 : 4000)) ts.canAdvance = true;
        }
      },
      exit: (g) => {
        const s = g.state; const e = g.rt.auction.engine; const res = e.result;
        s.auctionLog.push({ turn: s.turn, res: res.res, volume: res.volume, min: res.min, avg: res.avg, max: res.max });
        if (res.volume > 0) s.lastAvg[def.id] = res.avg;
        g.rt.auction.engine.ended = true;
      }
    };
  }
}


/* =====================================================================
 * Self-tests (?test=1). Pure logic only: no DOM, no storage, no assets.
 * ===================================================================== */
function runSelfTests() {
  const results = [];
  const t = (name, fn) => {
    try { const r = fn(); results.push({ name, ok: r === undefined || r === true, detail: r === undefined || r === true ? '' : String(r) }); }
    catch (e) { results.push({ name, ok: false, detail: `threw ${e.message}` }); }
  };
  const eq = (a, b, what = '') => (a === b ? true : `${what} expected ${b}, got ${a}`);
  const fresh = (seed = 'test', difficulty = 'colony') => GameState.create({ seed, difficulty });
  // Ledger-based setters keep the conservation invariant valid (tests that audit must never poke balances directly).
  const setInv = (state, id, res, n) => {
    const cur = ResourceLedger.stock(state, id, res);
    if (n > cur) ResourceLedger.moveItem(state, res, 'nature', id, n - cur); else if (n < cur) ResourceLedger.moveItem(state, res, id, 'nature', cur - n);
  };
  const setCash = (state, id, n) => {
    const cur = ResourceLedger.cash(state, id);
    if (n > cur) ResourceLedger.moveCash(state, 'nature', id, n - cur); else if (n < cur) ResourceLedger.moveCash(state, id, 'nature', cur - n);
  };
  const audited = (state, carried = 0) => { const bad = ResourceLedger.audit(state); if (!RucAudit.ok(state, carried)) bad.push(`RUCs ${JSON.stringify(RucAudit.count(state, carried))}`); return bad.length ? bad.join(';') : true; };
  const engineFor = (state, rng, res, ids, withStore = false, declareMs = 0) => new AuctionEngine({ market: AuctionEngine.fungibleMarket(RESOURCE_DEFS[res]), state, rng, colonists: ids, withStore, declareMs });
  /** A plot with a RUC taken from the corral (so the RUC book-keeping stays exact). */
  const develop = (state, pid, plotId, module) => { LandGrantSystem.assign(state, pid, plotId); const r = StoreSystem.buyRuc(state, pid); state.plots[plotId].ruc = { module, paid: r.price }; return state.plots[plotId]; };
  /** Stand-alone plots (custom tiny maps) for pure production maths. */
  const lone = (id, x, y, terrain, module, richness = 0, owner = 'p0') => { const p = Plot.create(id, x, y, terrain, richness); p.ownerId = owner; p.ruc = { module, paid: 100 }; return p; };
  /**
   * Land-race driver. Human inputs are timestamped on the GAME clock (`at`, ms) and queued up front, so the result must not
   * depend on the frame size `dt` used to advance time.
   */
  const raceRun = (state, rng, land, ms, dt = 10, inputs = []) => {
    inputs.forEach((i) => land.inputs.push({ pid: i.pid, at: i.at }));
    for (let tt = 0; tt < ms && !land.done; tt += dt) LandRace.update(state, rng, land, dt);
  };
  const owners = (state) => state.plots.map((p) => p.ownerId || '-').join('');
  // Walking helpers (pure DevWalk, no DOM).
  const walkState = (seed = 'walk') => { const { state, rng } = fresh(seed); return { state, rng, w: DevWalk.create(state, 'p0', 60000) }; };
  const go = (state, w, dir, ms) => DevWalk.update(state, w, dir, ms);
  const goUntil = (state, w, dir, pred, max = 30000) => { for (let tt = 0; tt < max && !pred(); tt += 10) DevWalk.update(state, w, dir, 10); return pred(); };
  const midY = (TOWN.streetTop + TOWN.streetBottom) / 2; const midX = (TOWN.passX0 + TOWN.passX1) / 2;
  /** Walks up to a building's doorway, pushes long enough to commit, waits out the whole scripted visit, then steps back off. */
  const visit = (state, w, id) => {
    const b = TOWN.buildings.find((x) => x.id === id); const n = w.log.length;
    const dy = b.door === 'bottom' ? -1 : 1;
    goUntil(state, w, { x: 0, y: w.y < midY ? 1 : -1 }, () => Math.abs(w.y - midY) < 4);
    goUntil(state, w, { x: Math.sign(b.spot.x - w.x), y: 0 }, () => Math.abs(w.x - b.spot.x) < 4);
    goUntil(state, w, { x: 0, y: dy }, () => !!w.visiting);
    go(state, w, { x: 0, y: dy }, CONFIG.WALK.visitMs + 50);
    goUntil(state, w, { x: 0, y: -dy }, () => w.latch === null);
    return w.log.slice(n);
  };
  /** Leaves the town through the south exit: the walker lands at the top edge of plot 31 (river, just below the town). */
  const leaveSouth = (state, w) => {
    goUntil(state, w, { x: 0, y: w.y < midY ? 1 : -1 }, () => Math.abs(w.y - midY) < 4);
    goUntil(state, w, { x: Math.sign(midX - w.x), y: 0 }, () => Math.abs(w.x - midX) < 3);
    return goUntil(state, w, { x: 0, y: 1 }, () => w.area === 'map');
  };
  const toHouse = (state, w, plotId) => goUntil(state, w, { x: 0, y: 1 }, () => DevWalk.atHouse(w, state.plots[plotId]));
  /** Presses Acció (starting a deferred install) and runs the game clock past CONFIG.WALK.installMs so it actually applies. */
  const install = (state, w) => { const k = DevWalk.act(state, w); if (k !== 'installing') return k; go(state, w, { x: 0, y: 0 }, CONFIG.WALK.installMs + 50); return 'install'; };
  const mkGame = () => { const g = new Game(document.createElement('canvas'), new AssetLoader([])); g.persist = false; return g; };
  const noSavedAt = (k, v) => (k === 'savedAt' ? undefined : v);

  /* ---------- PRNG and map ---------- */
  t('PRNG: same seed -> same sequence, different seed differs', () => {
    const a = new SeededRNG('x'); const b = new SeededRNG('x'); const c = new SeededRNG('y');
    const sa = [a.next(), a.next(), a.next()]; const sb = [b.next(), b.next(), b.next()];
    if (JSON.stringify(sa) !== JSON.stringify(sb)) return 'sequences differ for equal seeds';
    return c.next() !== sa[0] ? true : 'different seeds gave the same first value';
  });
  t('PRNG: getState/setState resumes the exact stream', () => {
    const a = new SeededRNG('resume'); a.next(); a.next(); const s = a.getState();
    const x = a.next(); const b = new SeededRNG('other'); b.setState(s);
    return eq(b.next(), x, 'resumed value');
  });
  t('Map: 9x5, river column with the town at its centre, >=8 plains, >=8 mountains, 1-3 peaks (60 seeds)', () => {
    for (let i = 0; i < 60; i++) {
      const plots = Plot.generateMap(new SeededRNG(`m${i}`));
      const rivers = plots.filter((p) => p.terrain === TERRAIN.RIVER); const town = plots.filter((p) => p.terrain === TERRAIN.TOWN);
      const plains = plots.filter((p) => p.terrain === TERRAIN.PLAIN).length;
      const mountains = plots.filter((p) => p.terrain === TERRAIN.MOUNTAIN);
      if (plots.length !== 45) return `seed m${i}: ${plots.length} plots`;
      if (rivers.length !== 4 || rivers.some((p) => p.x !== 4) || town.length !== 1 || town[0].id !== 22) return `seed m${i}: river/town wrong`;
      if (plains < 8 || mountains.length < 8) return `seed m${i}: plains ${plains} mountains ${mountains.length}`;
      if (mountains.some((p) => p.richness < 1 || p.richness > 3)) return `seed m${i}: richness`;
    }
    const { state } = fresh();
    return !LandGrantSystem.assign(state, 'p0', 22) && !Plot.claimable(state.plots[22]) ? true : 'the town could be claimed';
  });
  t('Map: same seed generates the same map', () => eq(JSON.stringify(Plot.generateMap(new SeededRNG('same'))), JSON.stringify(Plot.generateMap(new SeededRNG('same')))));

  /* ---------- P0.2 production ---------- */
  t('Production table: [manual] averages river/plain/mountain food 4/2/1, energy 2/3/1, smithore 0/1/1+peaks', () => {
    const { state } = fresh();
    const exp = [['river', 0, 4, 2, 0], ['plain', 0, 2, 3, 1], ['mountain', 1, 1, 1, 2], ['mountain', 2, 1, 1, 3], ['mountain', 3, 1, 1, 4]];
    for (const [ter, rich, f, e, s] of exp) {
      for (const [res, v] of [['food', f], ['energy', e], ['smithore', s]]) {
        const plot = lone(99, 0, 0, ter, res, rich); state.plots = [plot];
        if (ProductionSystem.meanYield(state, plot) !== v) return `${ter}${rich} ${res}: ${ProductionSystem.meanYield(state, plot)} != ${v}`;
      }
    }
  });
  t('Bonuses: adjacency +1 at most (two neighbours still +1); a scattered trio gives +1 each; six plots +2; they add up', () => {
    const { state } = fresh();
    const centre = lone(1, 1, 1, TERRAIN.PLAIN, 'energy'); state.plots = [centre, lone(2, 0, 1, TERRAIN.PLAIN, 'energy'), lone(3, 2, 1, TERRAIN.PLAIN, 'energy')];
    if (ProductionSystem.adjacencyBonus(state, centre) !== 1) return 'two neighbours must give +1, not +2';
    if (ProductionSystem.meanYield(state, centre) !== 5) return `centre: 3 + 1 + 1 expected, got ${ProductionSystem.meanYield(state, centre)}`;
    state.plots = [lone(1, 0, 0, TERRAIN.PLAIN, 'energy'), lone(2, 4, 2, TERRAIN.PLAIN, 'energy'), lone(3, 8, 4, TERRAIN.PLAIN, 'energy')];
    if (state.plots.some((p) => ProductionSystem.adjacencyBonus(state, p) !== 0 || ProductionSystem.learningBonus(state, p) !== 1)) return 'scattered trio must give +1 each and no adjacency';
    state.plots = [0, 2, 4, 6, 8].map((x, i) => lone(i + 1, x, 0, TERRAIN.PLAIN, 'energy')).concat([lone(9, 0, 4, TERRAIN.PLAIN, 'energy')]);
    if (ProductionSystem.learningBonus(state, state.plots[0]) !== 2) return 'six plots of the same good must give +2';
    state.plots = [lone(1, 0, 0, TERRAIN.PLAIN, 'energy'), lone(2, 1, 0, TERRAIN.PLAIN, 'energy', 0, 'p1'), lone(3, 0, 1, TERRAIN.PLAIN, 'food')];
    if (ProductionSystem.adjacencyBonus(state, state.plots[0]) !== 0) return 'a neighbour of another owner or good counted';
    // Manual example: 3 smithore mines, 2 of them side by side -> all +1 (learning curve), the two adjacent +1 more.
    state.plots = [lone(1, 0, 0, TERRAIN.MOUNTAIN, 'smithore', 1), lone(2, 1, 0, TERRAIN.MOUNTAIN, 'smithore', 1), lone(3, 5, 3, TERRAIN.MOUNTAIN, 'smithore', 1)];
    return eq(state.plots.map((p) => ProductionSystem.meanYield(state, p)).join(), '4,4,3', 'manual example');
  });
  t('River smithore stays 0 whatever the bonuses ([manual] no mining in the river valley)', () => {
    const { state, rng } = fresh();
    state.plots = [lone(1, 0, 0, TERRAIN.RIVER, 'smithore'), lone(2, 1, 0, TERRAIN.MOUNTAIN, 'smithore', 1), lone(3, 2, 0, TERRAIN.MOUNTAIN, 'smithore', 1)];
    for (let i = 0; i < 50; i++) if (ProductionSystem.rollYield(state, state.plots[0], rng) !== 0) return 'the river produced smithore';
    return eq(ProductionSystem.meanYield(state, state.plots[0]), 0, 'river mean');
  });
  t('Harvest variation (PROVISIONAL): seeded, same seed = same harvest, seeds differ, 0..8, never negative, centred on the mean', () => {
    const run = (seed) => { const rng = new SeededRNG(seed); const { state } = fresh(); const plot = lone(1, 0, 0, TERRAIN.RIVER, 'food'); state.plots = [plot]; return Array.from({ length: 400 }, () => ProductionSystem.rollYield(state, plot, rng)); };
    const a = run('h1'); const b = run('h1'); const c = run('h2');
    if (a.join() !== b.join()) return 'same seed gave a different harvest';
    if (a.join() === c.join()) return 'different seeds gave the same harvest';
    if (a.some((v) => v < 0 || v > 8)) return 'out of 0..8';
    const mean = a.reduce((s, v) => s + v, 0) / a.length;
    if (Math.abs(mean - 4) > 0.3) return `mean ${mean} (expected about 4)`;
    const { state } = fresh(); const rng = new SeededRNG('ext');
    state.plots = [0, 1, 2, 3, 4, 5, 6, 7, 8].map((x) => lone(x, x, 0, TERRAIN.MOUNTAIN, 'smithore', 3)).concat([lone(20, 0, 4, TERRAIN.MOUNTAIN, 'food', 1)]);
    if (ProductionSystem.meanYield(state, state.plots[0]) !== 8) return 'nine mines should average 8';
    for (let i = 0; i < 300; i++) for (const p of state.plots) { const v = ProductionSystem.rollYield(state, p, rng); if (v < 0 || v > 8) return `extreme ${v}`; }
  });
  t('Event modifiers: after the 0..8 clamp, integer percent floored once; a zeroed plot gives 0', () => {
    const { state } = fresh(); const p = lone(1, 0, 0, TERRAIN.PLAIN, 'energy'); state.plots = [p];
    state.modifiers.energyPct = 70; if (ProductionSystem.expectedYield(state, p) !== 2) return `floor(3*0.7) -> ${ProductionSystem.expectedYield(state, p)}`;
    state.modifiers.energyPct = 130; if (ProductionSystem.expectedYield(state, p) !== 3) return 'floor(3*1.3) must be 3';
    state.modifiers.zeroPlots.push({ plotId: 1, reason: 'breakdown' });
    return eq(ProductionSystem.expectedYield(state, p), 0, 'zeroed plot');
  });

  /* ---------- P0.3 energy ---------- */
  const energyCase = (modules, energy) => {
    const { state, rng } = fresh('energy'); state.turn = 2;
    const ids = [0, 2, 6]; modules.forEach((m, i) => develop(state, 'p0', ids[i], m));
    setInv(state, 'p0', 'energy', energy);
    const row = SettlementSystem.run(state, rng).rows[0];
    return { state, row, item: (m) => row.items.filter((it) => it.module === m) };
  };
  t('Energy: with 0 energy an energy RUC still produces (it powers itself)', () => {
    const c = energyCase(['energy'], 0);
    return c.item('energy')[0].active && c.row.used.energy === 0 && c.row.produced.energy > 0 ? true : JSON.stringify(c.row.items);
  });
  t('Energy: with 0 energy a food RUC is stopped; energy made this turn does not power it', () => {
    const c = energyCase(['energy', 'food'], 0);
    return !c.item('food')[0].active && c.row.produced.food === 0 && c.row.stopped === 1 ? true : JSON.stringify(c.row);
  });
  t('Energy: 1 energy, 1 energy RUC + 2 others -> exactly one other runs; only the energy really spent is reported', () => {
    const c = energyCase(['energy', 'food', 'smithore'], 1);
    const others = c.row.items.filter((it) => it.module !== 'energy' && it.active).length;
    if (others !== 1 || !c.item('energy')[0].active) return `active ${JSON.stringify(c.row.items)}`;
    if (c.row.used.energy !== 1 || c.row.stopped !== 1) return `used ${c.row.used.energy} stopped ${c.row.stopped}`;
    return audited(c.state);
  });

  /* ---------- P0.1 settlement (consumption, spoilage, harvest) ---------- */
  t('Settlement without harvest: food 6 -2 eaten -2 spoiled = 2; energy 6 -1 spoiled (25% of 6, floored) = 5', () => {
    const { state, rng } = fresh(); state.turn = 1;
    const row = SettlementSystem.run(state, rng).rows[0];
    return `${row.used.food},${row.spoiled.food},${row.final.food},${row.spoiled.energy},${row.final.energy}` === '2,2,2,1,5' ? true : JSON.stringify(row);
  });
  t('Settlement with harvest: old reserve and new harvest traced apart; the harvest is never spoiled this turn', () => {
    const { state, rng } = fresh('harv'); state.turn = 1;
    develop(state, 'p0', 31, 'food'); develop(state, 'p0', 2, 'energy');
    const row = SettlementSystem.run(state, rng).rows[0];
    for (const r of ['food', 'energy', 'smithore']) {
      if (row.final[r] !== row.start[r] - row.used[r] - row.spoiled[r] + row.produced[r]) return `${r}: ${JSON.stringify(row)}`;
    }
    if (row.produced.food < 1 || row.spoiled.food !== 2) return `food spoilage must only touch the reserve: ${JSON.stringify(row)}`;
    return state.players[0].inventory.food === row.final.food ? audited(state) : 'inventory differs from the report';
  });
  t('Settlement: odd amounts and zero (PROVISIONAL floor): food 3/5/0, energy 3/4/0', () => {
    const got = [3, 5, 0].map((f) => { const { state, rng } = fresh(); state.turn = 1; setInv(state, 'p0', 'food', f); return SettlementSystem.run(state, rng).rows[0]; });
    if (got.map((r) => `${r.spoiled.food}/${r.final.food}`).join() !== '0/1,1/2,0/0') return got.map((r) => `${r.spoiled.food}/${r.final.food}`).join();
    if (got[2].missingFood !== 2) return 'zero food must leave 2 missing';
    const en = [3, 4, 0].map((e) => { const { state, rng } = fresh(); state.turn = 1; setInv(state, 'p0', 'energy', e); return SettlementSystem.run(state, rng).rows[0].spoiled.energy; });
    return eq(en.join(), '0,1,0', 'energy spoilage');
  });
  t('Settlement: [card] smithore only spoils above 50 (50 keeps 50, 51 loses 1)', () => {
    const got = [50, 51].map((n) => { const { state, rng } = fresh(); setInv(state, 'p1', 'smithore', n); state.turn = 1; return SettlementSystem.run(state, rng).rows[1]; });
    return `${got[0].spoiled.smithore}/${got[0].final.smithore},${got[1].spoiled.smithore}/${got[1].final.smithore}` === '0/50,1/50' ? true : JSON.stringify(got.map((r) => r.spoiled));
  });
  t('Settlement: energy is spent from the reserve before spoilage and before the harvest', () => {
    const { state, rng } = fresh('eb'); state.turn = 1; develop(state, 'p0', 31, 'food'); setInv(state, 'p0', 'energy', 5);
    const row = SettlementSystem.run(state, rng).rows[0];
    // 5 - 1 used = 4 left, 25% spoils -> 1; no energy harvest
    return row.used.energy === 1 && row.spoiled.energy === 1 && row.final.energy === 3 ? true : JSON.stringify(row);
  });
  t('Settlement: runs once per turn (reload or a skipped screen never consumes twice)', () => {
    const { state, rng } = fresh('once'); state.turn = 3; develop(state, 'p0', 31, 'food');
    const a = SettlementSystem.run(state, rng); const inv = JSON.stringify(state.players.map((p) => p.inventory)); const r0 = rng.getState();
    const b = SettlementSystem.run(state, rng);
    const back = GameState.clone(state); const c = SettlementSystem.run(back, rng);
    if (a !== b || JSON.stringify(state.players.map((p) => p.inventory)) !== inv || rng.getState() !== r0) return 'second run changed something';
    return JSON.stringify(c) === JSON.stringify(a) ? audited(state) : 'a reloaded state ran the settlement again';
  });

  /* ---------- P0.4 food, time and no debt ---------- */
