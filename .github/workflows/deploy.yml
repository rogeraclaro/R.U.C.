name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run self-tests (?test=1) in headless Chrome
        run: |
          set -euo pipefail
          # The page runs runSelfTests() on load and logs "SELFTESTS passed/total". The render loop never ends, so the
          # browser is stopped as soon as that line appears (or after 120 s).
          google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run \
            --user-data-dir="$RUNNER_TEMP/chrome" --enable-logging=stderr --v=0 --virtual-time-budget=600000 \
            --dump-dom "file://$GITHUB_WORKSPACE/index.html?test=1" 2> chrome.log > /dev/null &
          pid=$!
          for i in $(seq 1 120); do grep -q 'SELFTESTS ' chrome.log && break; sleep 1; done
          sleep 1; kill "$pid" 2>/dev/null || true
          grep -o 'SELFTEST[^"]*' chrome.log || true
          line=$(grep -o 'SELFTESTS [0-9]*/[0-9]*' chrome.log | tail -1)
          if [ -z "$line" ]; then echo "::error::Self-tests did not run"; exit 1; fi
          passed=${line#SELFTESTS }; total=${passed#*/}; passed=${passed%/*}
          if [ "$passed" != "$total" ]; then echo "::error::Self-tests failed: $passed/$total"; exit 1; fi
          echo "All self-tests passed: $passed/$total"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the public folder (game files only)
        run: |
          mkdir -p public
          cp index.html public/
          cp -r assets public/

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete removes files that are no longer in the game; .well-known (SSL certificate validation) is never touched.
          rsync -rlptz --delete --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            public/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Check the live site
        run: |
          code=$(curl -s -o page.html -w '%{http_code}' https://ruc.masellas.info/)
          echo "HTTP $code"
          test "$code" = "200" && grep -q '<title>R.U.C.</title>' page.html
